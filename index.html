    critical: { ko: '급함', color: 'var(--danger)', bg: 'rgba(248,113,113,.08)', border: '#4a2226' },
    high: { ko: '필요', color: 'var(--warn)', bg: 'rgba(251,191,36,.07)', border: '#4a3c17' },
    mid: { ko: '있으면', color: 'var(--acc2)', bg: 'rgba(56,189,248,.06)', border: '#1e3a4a' }
  };

  RENDER.transfer = function (root) {
    if (S.players.length < 7) {
      root.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'empty' }, [
          h('b', { text: '선수가 부족합니다' }),
          '스쿼드를 먼저 가져오세요. 최소 7명이 있어야 약점을 볼 수 있습니다.'
        ])
      ]));
      return;
    }
    var sig = baseSignature();
    var rep;
    if (S._needsCache && S._needsCache.sig === sig) {
      rep = S._needsCache.rep;
    } else {
      var base = (S._baseCache && S._baseCache.sig === sig) ? S._baseCache.res : null;
      try {
        rep = E.squadNeeds({ players: S.players, standing: S.standing || 'mid', base: base });
      } catch (err) {
        root.appendChild(h('div', { class: 'card' }, [h('div', { class: 'rep err', text: '오류: ' + (err && err.message) })]));
        return;
      }
      if (!rep) return;
      S._needsCache = { sig: sig, rep: rep };
      if (!S._baseCache || S._baseCache.sig !== sig) S._baseCache = { sig: sig, res: rep.base };
    }

    root.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: '영입이 필요한 자리' }),
      h('div', { class: 'desc' }, [
        '「기본 전술」의 ', h('b', { style: 'color:var(--text)', text: rep.base.formation.ko + ' · ' + rep.base.plan.ko }),
        ' 기준입니다. 포지션에 사람이 몇 명인지가 아니라, ',
        h('b', { style: 'color:var(--text)', text: '그 자리가 요구하는 역할을 수행할 수 있는지' }),
        '로 봅니다 — 이름만 그 자리인 선수는 없는 것과 같습니다.'
      ])
    ]));

    if (rep.team.length) {
      var tc = h('div', { class: 'card' }, [h('h2', { text: '팀 전체의 구멍' })]);
      rep.team.forEach(function (t) {
        tc.appendChild(h('div', { class: 'warn high' }, [h('span', { class: 'ic', text: '!' }), h('span', { text: t })]));
      });
      root.appendChild(tc);
    }

    if (!rep.needs.length) {
      root.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'empty' }, [
          h('b', { text: '급한 자리가 없습니다' }),
          '기본 전술 기준으로 모든 자리에 쓸 만한 주전과 백업이 있습니다.'
        ])
      ]));
    }

    rep.needs.forEach(function (n) {
      var sv = SEV[n.severity];
      var attrs = h('div', { class: 'chips', style: 'margin-top:7px' });
      n.wantAttrs.forEach(function (a) {
        var lack = a.need && a.best !== null && a.best < a.need;
        attrs.appendChild(h('span', {
          class: 'chip', style: 'cursor:default' + (lack ? ';border-color:var(--danger);color:var(--danger)' : ''),
          title: a.best === null ? '이 자리를 볼 수 있는 선수가 없어 비교값이 없습니다'
            : ('지금 이 자리 최고: ' + a.best)
        }, [a.ko + (a.target ? ' ' + a.target + '↑' : ''),
            a.best !== null ? h('small', { style: 'opacity:.65', text: ' (현 ' + a.best + ')' }) : null]));
      });

      root.appendChild(h('div', {
        class: 'card',
        style: 'border-color:' + sv.border + ';background:' + sv.bg
      }, [
        h('div', { class: 'row', style: 'gap:8px;align-items:baseline;margin-bottom:3px' }, [
          h('span', { style: 'font-size:11px;font-weight:800;color:' + sv.color, text: sv.ko }),
          h('h2', { style: 'font-size:15px', text: n.ko + ' · ' + n.role.ko + ' / ' + RD.DUTIES[n.duty].ko })
        ]),
        h('div', { class: 'small', style: 'color:var(--dim);margin-bottom:6px', text: n.reason }),
        h('div', { class: 'small' }, [
          h('b', { style: 'color:var(--acc)', text: '찾을 유형 ' }),
          n.profile
        ]),
        attrs,
        h('div', { class: 'tiny muted', style: 'margin-top:8px' }, [
          '지금: 주전 ',
          n.starter ? (n.starter.name + ' (' + n.starter.fit + (n.starter.natural ? '' : ' · 다른 자리 선수') + ')') : '없음',
          ' · 백업 ', n.backup ? (n.backup.name + ' (' + n.backup.fit + ')') : '없음',
          ' · 등록 ' + n.naturalCount + '명 / 선발 ' + n.slots + '자리'
        ])
      ]));
    });

    if (rep.surplus.length) {
      root.appendChild(h('div', { class: 'card' }, [
        h('h2', { text: '남는 자리' }),
        h('div', { class: 'desc', text: '선발 자리보다 3명 이상 많은 포지션입니다 — 정리하거나 임대를 보내 다른 자리를 채울 여지가 있습니다.' }),
        h('div', { class: 'chips' }, rep.surplus.map(function (s) {
          return h('span', { class: 'chip', style: 'cursor:default', text: s.ko + ' ' + s.count + '명 (선발 ' + s.need + ')' });
        }))
      ]));
    }

    root.appendChild(h('div', { class: 'card tight' }, [
      h('div', { class: 'small muted' }, [
        '요구 능력치는 역할이 성립하기 위한 최소치이고, 그 값이 없는 역할은 ',
        h('b', { text: '지금 팀 수준을 기준으로' }), ' 적었습니다(급한 자리는 한 단계 위, 백업은 비슷한 수준). ',
        'FM 스카우트 필터에 그대로 옮겨 쓸 수 있게 숫자로 냈습니다. ',
        h('b', { text: '이건 이적료나 나이를 보지 않습니다' }), ' — 어떤 선수가 필요한지까지이고, 누구를 살지는 스카우트 화면에서 정하세요.'
      ])
    ]));
  };

  // ── 결과 화면 공통 조각 ─────────────────────────────────────────────────
  function fmStepsCard(plan, formation, instructions, piCount) {
    var preset = TD.FM_PRESETS[plan.id];
    var shifted = Object.keys(instructions.axes).filter(function (k) { return instructions.axes[k].shifted; }).length;
    var onCount = Object.keys(instructions.toggles).filter(function (k) { return instructions.toggles[k].on; }).length;
    var ol = h('ol', { style: 'margin:0;padding-left:19px;font-size:13px;line-height:1.85;color:var(--dim)' });
    ol.appendChild(h('li', {}, [
      '전술 유형을 고릅니다 — ',
      h('b', { style: 'color:var(--acc)', text: preset ? preset.ko : TD.FM_PRESET_BLANK }),
      preset && preset.alt ? h('span', { class: 'tiny muted', text: ' (또는 ' + preset.alt + ')' }) : null,
      h('span', { class: 'tiny muted', text: '  · 프리셋은 역할과 지시를 자기 값으로 채우니 아래와 다른 부분은 덮어쓰세요. 어긋나는 게 싫으면 「' + TD.FM_PRESET_BLANK + '」으로 백지에서 시작하면 됩니다.' })
    ]));
    ol.appendChild(h('li', {}, ['포메이션을 ', h('b', { style: 'color:var(--text)', text: formation.ko }),
      ro(formation.ko) + ' 바꿉니다.']));
    ol.appendChild(h('li', {}, ['멘탈리티를 ', h('b', { style: 'color:var(--text)', text: instructions.axes.mentality.label }),
      ro(instructions.axes.mentality.label) + ' 둡니다.']));
    ol.appendChild(h('li', {}, ['자리마다 역할과 임무를 지정합니다 (아래 ',
      h('b', { style: 'color:var(--text)', text: '포지션별 역할과 임무' }), ' 11줄).']));
    ol.appendChild(h('li', {}, ['팀 지시를 맞춥니다 — 바꿀 것은 ',
      h('b', { style: 'color:var(--text)', text: '축 ' + Math.max(0, shifted - 1) + '개 · 켤 지시 ' + onCount + '개' }), '뿐입니다.']));
    if (piCount) ol.appendChild(h('li', {}, ['개인 지시를 넣습니다 (', h('b', { style: 'color:var(--text)', text: piCount + '명' }), ').']));
    return h('div', { class: 'card' }, [
      h('h2', { text: 'FM에 옮기는 순서' }),
      h('div', { class: 'desc', text: '전술 → 기본 정보 화면에서 이 순서대로 하면 됩니다.' }),
      ol
    ]);
  }

  /*
   * 이탈 선수 때문에 달라진 것.
   * "누가 빠졌다"만 알려 주면 왜 역할이 바뀌었는지 알 수 없습니다.
   * 전원이 있었다면 어땠을지와 나란히 놓고 달라진 것만 보여 줍니다.
   */
  function injuryImpactCard(res) {
    var im = res.injuryImpact;
    if (!im) return null;
    var has = im.formation || im.plan || im.slots.length || im.instructions.length;
    if (!has) {
      return h('div', { class: 'card tight' }, [
        h('div', { class: 'small muted' }, [
          h('b', { style: 'color:var(--acc)', text: '이탈 선수가 전술을 바꾸지는 않았습니다. ' }),
          '대체 선수가 같은 역할을 수행할 수 있어 형태와 지시가 그대로입니다.'
        ])
      ]);
    }
    var card = h('div', { class: 'card', style: 'border-color:#4a3c17;background:rgba(251,191,36,.05)' }, [
      h('h2', { text: '이탈 선수로 달라진 점' }),
      h('div', { class: 'desc', text: '전원이 있었을 때와 견준 결과입니다. 대체 선수의 성격이 다르면 역할과 지시가 함께 움직입니다.' })
    ]);
    if (im.formation) {
      card.appendChild(h('div', { class: 'warn high' }, [
        h('span', { class: 'ic', text: '!' }),
        h('span', {}, ['포메이션이 ', h('b', { text: im.formation.from }), ' → ',
          h('b', { text: im.formation.to }), '으로 바뀌었습니다. 빠진 선수가 그 형태의 전제였습니다.'])
      ]));
    }
    if (im.plan) {
      card.appendChild(h('div', { class: 'warn' }, [
        h('span', { class: 'ic', text: '·' }),
        h('span', {}, ['전술 방향이 ', h('b', { text: im.plan.from }), ' → ', h('b', { text: im.plan.to }), '으로 바뀌었습니다.'])
      ]));
    }
    im.slots.forEach(function (sl) {
      var big = sl.fitDrop != null && sl.fitDrop >= 10;
      card.appendChild(h('div', { class: 'bi', style: 'margin-bottom:6px' }, [
        h('div', { class: 'g', text: posLabel(sl.slot) + (sl.wasUnavailable ? ' · 이탈' : ' · 연쇄 이동') }),
        h('div', { class: 'w' }, [
          (sl.fromPlayer || '—') + ' → ' + (sl.toPlayer || '—'),
          sl.fitDrop != null && sl.fitDrop !== 0
            ? h('span', { style: 'margin-left:7px;font-size:11.5px;color:' + (sl.fitDrop > 0 ? 'var(--danger)' : 'var(--acc)'),
                text: '적합도 ' + (sl.fitDrop > 0 ? '−' : '+') + Math.abs(sl.fitDrop) })
            : null
        ]),
        sl.roleChanged
          ? h('div', { class: 'a' }, ['역할도 바뀝니다: ', h('b', { style: 'color:var(--text)', text: sl.fromRole }),
              ' → ', h('b', { style: 'color:var(--text)', text: sl.toRole }),
              '. 대체 선수가 잘하는 것이 달라 역할을 맞췄습니다.'])
          : null,
        big
          ? h('div', { class: 'a', style: 'color:var(--warn)', text: '적합도가 크게 떨어집니다 — 이 자리를 덜 쓰는 포메이션으로 바꾸는 것도 방법입니다. 아래 「다른 포메이션 후보」를 보세요.' })
          : null
      ]));
    });
    if (im.instructions.length) {
      card.appendChild(h('div', { class: 'small', style: 'margin-top:8px;color:var(--dim)' }, [
        h('b', { style: 'color:var(--text)', text: '함께 바뀐 지시: ' }),
        im.instructions.map(function (i) { return i.ko + ' ' + i.from + '→' + i.to; }).join(' · ')
      ]));
    }
    return card;
  }

  function unavailableNote(list) {
    if (!list || !list.length) return null;
    return h('div', { class: 'card tight' }, [
      h('div', { class: 'small muted' }, [
        h('b', { style: 'color:var(--warn)', text: list.length + '명을 빼고 짰습니다 — ' }),
        list.map(function (u) { return u.name + '(' + u.reason + ')'; }).join(', '),
        '. 「스쿼드」 탭에서 상태를 되돌리면 다시 포함됩니다.'
      ])
    ]);
  }

  function warningsCard(warnings) {
    var wc = h('div', { class: 'card' }, [
      h('h2', { text: '점검할 점' }),
      h('div', { class: 'desc', text: '이 조합에서 실제로 문제가 되는 부분입니다.' })
    ]);
    warnings.forEach(function (w) {
      wc.appendChild(h('div', { class: 'warn' + (w.level === 'high' ? ' high' : '') }, [
        h('span', { class: 'ic', text: w.level === 'high' ? '!' : '·' }),
        // 무엇이 잘못됐는지만 알려 주면 화면 앞에서 다시 막힙니다.
        h('span', {}, [w.text, w.fix ? h('span', { class: 'fixnote', text: '→ ' + w.fix }) : null])
      ]));
    });
    return wc;
  }

  // ── 세트피스 ────────────────────────────────────────────────────────────
  function setPieceCard(xi) {
    var sp;
    try { sp = E.setPieces(xi); } catch (e) { return null; }
    if (!sp) return null;
    var anyPick = sp.attack.concat(sp.defence, sp.specialists)
      .some(function (s) { return s.picks.length; });
    if (!anyPick) return null;

    function group(title, desc, rows) {
      var box = h('div', { style: 'margin-top:12px' }, [
        h('div', { style: 'font-size:12px;font-weight:800;margin-bottom:3px', text: title }),
        h('div', { class: 'tiny muted', style: 'margin-bottom:7px', text: desc })
      ]);
      rows.forEach(function (s) {
        var val = s.picks.length
          ? s.picks.map(function (p) { return p.name; }).join(', ')
          : '조건을 넘는 선수가 없습니다';
        box.appendChild(h('details', { class: 'help' }, [
          h('summary', {}, [
            h('span', { style: 'font-weight:700', text: s.ko }),
            h('span', { class: 'tiny muted', text: '  ' + s.fm }),
            h('div', { style: 'font-size:12.5px;color:' + (s.picks.length ? 'var(--text)' : 'var(--dim2)'), text: val })
          ]),
          h('div', { class: 'body' }, [
            h('div', { class: 'tiny', style: 'color:var(--dim)', text: s.why }),
            s.picks.length ? h('div', { class: 'tiny muted', style: 'margin-top:4px',
              text: s.picks.map(function (p) { return p.name + ' · ' + p.pos + ' ' + p.role; }).join(' / ') }) : null,
            (!s.picks.length && s.need) ? h('div', { class: 'tiny muted', style: 'margin-top:4px',
              text: '최소 기준: ' + Object.keys(s.need).map(function (k) {
                return (RD.ATTRS[k] ? RD.ATTRS[k].ko : k) + ' ' + s.need[k];
              }).join(' · ') }) : null
          ])
        ]));
      });
      return box;
    }

    function line(cls, icon, text, fix) {
      return h('div', { class: cls }, [
        h('span', { class: 'ic', text: icon }),
        h('span', {}, [text, fix ? h('span', { class: 'fixnote', text: '→ ' + fix }) : null])
      ]);
    }

    var card = h('details', { class: 'card' });
    card.appendChild(h('summary', { style: 'cursor:pointer' }, [
      h('span', { style: 'font-size:15px;font-weight:800', text: '세트피스' }),
      sp.verdict ? h('span', { class: 'tiny muted', text: '  ' + (sp.verdict.level === 'good' ? '이 팀의 득점 경로'
        : sp.verdict.level === 'mid' ? '덤' : '기대하기 어려움') }) : null
    ]));
    card.appendChild(h('div', { class: 'desc', style: 'margin-top:8px',
      text: '선발 11명만 보고 정합니다. FM 전술 → 세트피스에서 같은 자리에 이 선수를 넣으면 됩니다(게임 언어가 달라도 찾을 수 있게 영문 표기를 같이 적었습니다).' }));

    if (sp.verdict) {
      card.appendChild(line(sp.verdict.level === 'good' ? 'warn high' : 'warn',
        sp.verdict.level === 'good' ? '★' : '·', sp.verdict.text, sp.verdict.fix));
    }
    sp.swing.forEach(function (s) { card.appendChild(line('warn', '·', s.text, s.fix)); });
    if (sp.weakDefence) card.appendChild(line('warn high', '!', sp.weakDefence.text, sp.weakDefence.fix));

    card.appendChild(group('공격 코너', '박스 안 셋 + 가장자리 하나 + 뒤 둘. 한 사람이 두 자리를 겸하지 않습니다.', sp.attack));
    card.appendChild(group('수비 코너', '맨마킹 셋에 니어 포스트·가장자리·앞에 남길 한 명씩.', sp.defence));
    card.appendChild(group('프리킥 · 페널티 · 스로인', '이쪽은 같은 선수가 여러 개를 겸해도 됩니다.', sp.specialists));

    if (sp.known < 6) {
      card.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:9px',
        text: '능력치를 아는 선발이 ' + sp.known + '명뿐이라 일부 자리는 비워 뒀습니다 — 모르는 값으로 지정하면 엉뚱한 선수가 키커가 됩니다.' }));
    }
    return card;
  }

  function instructionsCard(instructions) {
    var ic = h('div', { class: 'card' }, [
      h('h2', { text: '팀 지시' }),
      h('div', { class: 'desc', text: '색이 들어온 항목만 기본값에서 바꾸면 됩니다. 각 줄을 누르면 왜 그렇게 정해졌는지 나옵니다.' })
    ]);
    ['core', 'ip', 'tr', 'ood'].forEach(function (g) {
      var items = [];
      Object.keys(instructions.axes).forEach(function (k) {
        var a = instructions.axes[k];
        if (a.group === g) items.push(axisRow(a));
      });
      Object.keys(instructions.toggles).forEach(function (k) {
        var t = instructions.toggles[k];
        if (t.group === g && (t.on || t.reasons.length)) items.push(toggleRow(t));
      });
      if (!items.length) return;
      ic.appendChild(h('h3', { style: 'font-size:12px;color:var(--dim);margin:13px 0 6px', text: TD.GROUP_KO[g] }));
      var box = h('div', { class: 'instr' });
      items.forEach(function (i) { box.appendChild(i); });
      ic.appendChild(box);
    });
    return ic;
  }

  function individualCard(individual) {
    var pc = h('div', { class: 'card' }, [
      h('h2', { text: '개인 지시' }),
      h('div', { class: 'desc', text: '선수 개인 능력치와 상대 특징에서 나온 항목만 적었습니다. 점선 표시는 역할이 자동으로 켜서 끌 수 없는 지시입니다.' })
    ]);
    if (!individual.length) {
      pc.appendChild(h('div', { class: 'small muted', text: '따로 손댈 개인 지시가 없습니다 — 역할 기본값 그대로 두세요.' }));
    }
    individual.forEach(function (p) {
      var ul = h('ul');
      p.items.forEach(function (it) {
        ul.appendChild(h('li', { class: it.locked ? 'lock' : '' }, [
          h('b', { text: it.text }),
          h('span', { class: 'r', text: it.why })
        ]));
      });
      pc.appendChild(h('div', { class: 'pi' }, [
        h('h4', {}, [
          (p.player ? p.player.name : posLabel(p.slot)),
          h('small', { text: p.role.ko + ' / ' + RD.DUTIES[p.duty].ko + ' · ' + posLabel(p.slot) })
        ]),
        ul
      ]));
    });
    return pc;
  }

  // 기본 전술 텍스트로 복사 — 맞춤 전술과 형식을 맞춥니다.
  function copyBase(res) {
    var L = [];
    L.push('■ FM24 시즌 기본 전술 — ' + res.formation.ko + ' / ' + res.plan.ko);
    L.push('FM 전술 유형: ' + ((TD.FM_PRESETS[res.plan.id] || {}).ko || TD.FM_PRESET_BLANK));
    L.push('');
    L.push('[선발과 역할]');
    res.xi.lineup.forEach(function (l, i) {
      var back = res.bench[i];
      L.push('  ' + posLabel(l.slot).padEnd(6) + ' ' + l.role.ko + ' / ' + RD.DUTIES[l.duty].ko +
        '  —  ' + (l.player ? l.player.name : '(미배정)') + (l.fit != null ? ' (' + l.fit + ')' : '') +
        (back && back.player ? '   교체: ' + back.player.name + ' (' + back.fit + ')' : ''));
    });
    L.push('');
    L.push('[팀 지시]');
    ['core', 'ip', 'tr', 'ood'].forEach(function (g) {
      var rows = [];
      Object.keys(res.instructions.axes).forEach(function (k) {
        var a = res.instructions.axes[k];
        if (a.group === g && a.shifted) rows.push('  ' + a.ko + ': ' + a.label);
      });
      Object.keys(res.instructions.toggles).forEach(function (k) {
        var t = res.instructions.toggles[k];
        if (t.group === g && t.on) rows.push('  ' + t.ko + ': 켜기');
      });
      if (rows.length) { L.push(' <' + TD.GROUP_KO[g] + '>'); rows.forEach(function (r) { L.push(r); }); }
    });
    if (res.individual.length) {
      L.push('');
      L.push('[개인 지시]');
      res.individual.forEach(function (p) {
        L.push('  ' + (p.player ? p.player.name : posLabel(p.slot)) + ' (' + p.role.ko + '/' + RD.DUTIES[p.duty].ko + ')');
        p.items.forEach(function (it) { L.push('    - ' + it.text + (it.locked ? ' (역할 고정)' : '')); });
      });
    }
    if (res.warnings.length) {
      L.push('');
      L.push('[점검할 점]');
      res.warnings.forEach(function (w) {
        L.push('  ! ' + w.text);
        if (w.fix) L.push('      → ' + w.fix);
      });
    }
    appendSetPieces(L, res.xi);
    writeClipboard(L.join('\n'));
  }

  // 복사한 글에도 세트피스를 넣습니다 — FM 화면 옆에 붙여 놓고 그대로 따라
  // 치는 용도라, 화면에만 있으면 정작 쓸 때 없습니다.
  function appendSetPieces(L, xi) {
    var sp;
    try { sp = E.setPieces(xi); } catch (e) { return; }
    if (!sp) return;
    var rows = [['공격 코너', sp.attack], ['수비 코너', sp.defence], ['프리킥·페널티·스로인', sp.specialists]];
    if (!rows.some(function (r) { return r[1].some(function (x) { return x.picks.length; }); })) return;
    L.push('');
    L.push('[세트피스]');
    if (sp.verdict) L.push('  ' + sp.verdict.text);
    sp.swing.forEach(function (x) { L.push('  ' + x.text); });
    if (sp.weakDefence) L.push('  ! ' + sp.weakDefence.text);
    rows.forEach(function (r) {
      L.push('  · ' + r[0]);
      r[1].forEach(function (x) {
        L.push('      ' + x.ko + ' (' + x.fm + '): '
          + (x.picks.length ? x.picks.map(function (p) { return p.name; }).join(', ') : '조건을 넘는 선수 없음'));
      });
    });
  }

  // ── 경기 중 탭 ──────────────────────────────────────────────────────────
  RENDER.match = function (root) {
    var M = S.match;
    // 예전 판에서 저장한 상태에는 없는 값입니다
    if (!M.oppLevel) M.oppLevel = 'even';

    // 1) 상황
    var flagChips = h('div', { class: 'chips' });
    TD.MATCH_FLAGS.forEach(function (f) {
      flagChips.appendChild(h('button', {
        class: 'chip', 'aria-pressed': M.flags.indexOf(f.id) >= 0 ? 'true' : 'false',
        onclick: function () {
          var i = M.flags.indexOf(f.id);
          if (i >= 0) M.flags.splice(i, 1); else M.flags.push(f.id);
          save(); render();
        }
      }, [f.ko]));
    });

    root.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: '지금 상황' }),
      h('div', { class: 'desc', text: '시간대와 점수만 넣어도 조정안이 나옵니다. 전반 기록까지 넣으면 훨씬 구체적으로 갈립니다.' }),
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '시간대' }),
        (function () {
          var seg = h('div', { class: 'seg', style: 'flex-wrap:wrap' });
          TD.MATCH_PHASES.forEach(function (p) {
            seg.appendChild(h('button', {
              'aria-pressed': M.phase === p.id ? 'true' : 'false',
              style: 'flex:1 0 33%',
              onclick: function () { M.phase = p.id; save(); render(); }
            }, [p.ko]));
          });
          return seg;
        })()
      ]),
      h('div', { class: 'grid2' }, [
        h('div', { class: 'field' }, [
          h('label', { class: 'f', text: '우리 득점' }),
          h('input', {
            type: 'number', min: '0', max: '20', inputmode: 'numeric', value: String(M.gf),
            oninput: function (e) { M.gf = Math.max(0, parseInt(e.target.value, 10) || 0); save(); refreshAdvice(); }
          })
        ]),
        h('div', { class: 'field' }, [
          h('label', { class: 'f', text: '상대 득점' }),
          h('input', {
            type: 'number', min: '0', max: '20', inputmode: 'numeric', value: String(M.ga),
            oninput: function (e) { M.ga = Math.max(0, parseInt(e.target.value, 10) || 0); save(); refreshAdvice(); }
          })
        ])
      ]),
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '상대 전력' }),
        (function () {
          var seg = h('div', { class: 'seg' });
          TD.OPP_LEVELS.forEach(function (l) {
            seg.appendChild(h('button', {
              'aria-pressed': M.oppLevel === l.id ? 'true' : 'false',
              onclick: function () { M.oppLevel = l.id; save(); render(); }
            }, [l.ko]));
          });
          return seg;
        })(),
        h('div', { class: 'tiny muted', style: 'margin-top:5px',
          text: '같은 1:1이라도 강팀 원정에서는 지켜야 할 승점 1이고, 약체 상대로는 잃고 있는 승점 2입니다.' })
      ]),
      h('label', { class: 'f', text: '해당하는 상황' }),
      flagChips
    ]));

    // 2) 전반 기록
    var mta;
    var statCard = h('div', { class: 'card dropzone' }, [
      h('h2', { text: '전반 기록 (선택)' }),
      h('div', { class: 'desc', text: 'FM 경기 통계 화면을 내보내 넣으세요. 슈팅·유효 슈팅·기대 득점·점유율·패스 성공률이 있으면 "무엇이 문제인지"까지 나옵니다.' }),
      h('div', { class: 'row', style: 'margin-bottom:9px' }, [
        filePicker('파일 선택', function (fl) { readFiles(fl, function (items) { readStats(items[0] && items[0].text); }); }),
        h('button', { class: 'btn', onclick: function () { readStats(mta.value); } }, ['붙여넣은 내용 읽기']),
        M.stats ? h('button', { class: 'btn ghost sm', onclick: function () { M.stats = null; save(); render(); } }, ['기록 지우기']) : null
      ]),
      (mta = h('textarea', { placeholder: '경기 통계 화면 내보내기 내용', 'aria-label': '경기 기록 붙여넣기' })),
      statsReportBox()
    ]);
    makeDropTarget(statCard, function (fl) { readFiles(fl, function (items) { readStats(items[0] && items[0].text); }); });
    root.appendChild(statCard);

    function readStats(text) {
      if (!text || !text.trim()) { toast('읽을 내용이 비어 있습니다.'); return; }
      var res = IMP.parseMatchStats(text);
      if (res.error || !res.rows.length) {
        M.stats = { error: res.error || '표를 찾지 못했습니다.', format: res.format };
      } else {
        M.stats = { rows: res.rows, left: res.left, right: res.right, unknown: res.unknown };
      }
      save(); render();
    }

    function statsReportBox() {
      if (!M.stats) return h('div');
      if (M.stats.error) {
        return h('div', { class: 'rep err' }, [
          h('div', {}, [h('b', { text: '읽지 못했습니다. ' }), M.stats.error]),
          h('div', { class: 'tiny muted', style: 'margin-top:6px',
            text: 'FM 경기 화면에서 통계 표가 보이는 상태로 내보냈는지 확인하세요. 표가 아니라 그림으로 보이는 화면은 빈 파일이 나옵니다.' })
        ]);
      }
      var box = h('div', { class: 'rep' });
      box.appendChild(h('div', { class: 'small', style: 'margin-bottom:7px' }, [
        h('b', { text: '어느 쪽이 우리 팀인가요?' }),
        ' 파일에는 팀 이름이 없어 알 수 없습니다 — 잘못 고르면 조언이 통째로 반대가 됩니다.'
      ]));
      var seg = h('div', { class: 'seg', style: 'margin-bottom:9px' });
      [['left', '왼쪽'], ['right', '오른쪽']].forEach(function (o) {
        var v = M.stats[o[0]] || {};
        seg.appendChild(h('button', {
          'aria-pressed': M.side === o[0] ? 'true' : 'false',
          onclick: function () { M.side = o[0]; save(); render(); }
        }, [o[1] + ' (슈팅 ' + fmtStat(v.shots) + ' · 점유 ' + fmtStat(v.possession) + '%)']));
      });
      box.appendChild(seg);
      var tbl = h('div', { class: 'statrows' });
      M.stats.rows.forEach(function (r) {
        var ours = M.side === 'left' ? r.left : r.right;
        var theirs = M.side === 'left' ? r.right : r.left;
        tbl.appendChild(h('div', { class: 'statrow' }, [
          h('b', { class: 'us', text: fmtStat(ours) }),
          h('span', { class: 'lb', text: r.label }),
          h('span', { class: 'them', text: fmtStat(theirs) })
        ]));
      });
      box.appendChild(tbl);
      if (M.stats.unknown && M.stats.unknown.length) {
        box.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:7px',
          text: '읽지 못한 항목: ' + M.stats.unknown.slice(0, 8).join(', ') }));
      }
      return box;
    }

    // 3) 조정안
    var advice;
    try {
      advice = E.inMatchAdvice({
        phase: M.phase, goalsFor: M.gf, goalsAgainst: M.ga,
        oppLevel: M.oppLevel, flags: M.flags,
        stats: M.stats && !M.stats.error
          ? { us: M.stats[M.side], them: M.stats[M.side === 'left' ? 'right' : 'left'] }
          : null
      });
    } catch (err) {
      root.appendChild(h('div', { class: 'card' }, [h('div', { class: 'rep err', text: '오류: ' + (err && err.message) })]));
      return;
    }

    var head = h('div', { class: 'card' }, [
      h('h2', {}, [
        advice.phase.ko + ' · ',
        h('span', { style: 'color:' + (advice.score.diff > 0 ? 'var(--acc)' : advice.score.diff < 0 ? 'var(--danger)' : 'var(--dim)'),
          text: advice.score.gf + ' : ' + advice.score.ga }),
        h('span', { class: 'tiny muted', text: '  · 상대 ' + oppLevelKo(advice.oppLevel) }),
        advice.hasStats ? h('span', { class: 'tiny muted', text: '  · 전반 기록 반영' }) : null
      ]),
      h('div', { class: 'desc', text: advice.fired.length
        ? '위에서부터 순서대로 하면 됩니다. 「그대로 두세요」가 있으면 그게 가장 중요한 조언입니다.'
        : '지금 상황에서 특별히 손댈 것이 없습니다 — 하던 대로 두세요.' })
    ]);
    root.appendChild(head);

    advice.fired.forEach(function (f) {
      var isHold = f.items.some(function (i) { return i.kind === 'hold'; });
      var card = h('div', {
        class: 'card',
        style: f.tier === 'key'
          ? ('border-color:' + (isHold ? '#2c4a35' : '#4a3c17') + ';background:' + (isHold ? 'rgba(74,222,128,.055)' : 'rgba(251,191,36,.05)'))
          : ''
      }, [
        h('div', { class: 'row', style: 'gap:7px;align-items:baseline;margin-bottom:5px' }, [
          h('span', { style: 'font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--dim2)', text: f.group }),
          h('span', { style: 'font-size:13.5px;font-weight:700', text: f.why })
        ])
      ]);
      var ul = h('ul', { style: 'margin:0;padding-left:0;list-style:none' });
      f.items.forEach(function (i) {
        ul.appendChild(h('li', { style: 'margin-bottom:7px;font-size:12.5px' }, [
          h('b', {
            style: 'display:inline-block;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:11px;'
              + (i.kind === 'hold' ? 'background:rgba(74,222,128,.15);color:var(--acc)'
                : 'background:var(--panel3);border:1px solid var(--line2);color:var(--dim)'),
            text: KIND_KO[i.kind] || i.kind
          }),
          i.text,
          i.why ? h('span', { style: 'display:block;color:var(--dim2);font-size:11.5px;margin-top:2px', text: i.why }) : null
        ]));
      });
      card.appendChild(ul);
      root.appendChild(card);
    });

    if (advice.fired.length) {
      root.appendChild(h('div', { class: 'card tight' }, [
        h('div', { class: 'row' }, [
          h('button', { class: 'btn', onclick: function () { copyAdvice(advice); } }, ['조정안 복사'])
        ])
      ]));
    }

    // 4) 참고 — 상황별 기본 지침
    var ref = h('div', { class: 'card' }, [
      h('h2', { text: '상황별 기본 지침' }),
      h('div', { class: 'desc', text: '위 조정안과 별개로, 상황마다 무엇을 어떤 순서로 건드릴지 정리해 둔 것입니다.' })
    ]);
    TD.SCENARIOS.forEach(function (sc) {
      var ol = h('ol');
      sc.steps.forEach(function (s) { ol.appendChild(h('li', { text: s })); });
      ref.appendChild(h('details', { class: 'help' }, [
        h('summary', { text: sc.ko }),
        h('div', { class: 'body' }, [
          h('div', { class: 'tiny muted', style: 'margin-bottom:4px', text: sc.when }),
          ol
        ])
      ]));
    });
    root.appendChild(ref);

    function refreshAdvice() { render(); }
  };

  var KIND_KO = { hold: '그대로', axis: '지시', toggle: '지시', shape: '형태', sub: '교체' };
  function fmtStat(v) {
    return (typeof v === 'number' && isFinite(v)) ? String(v) : '—';
  }
  function oppLevelKo(id) {
    var l = TD.OPP_LEVELS.filter(function (x) { return x.id === id; })[0];
    return l ? l.ko : id;
  }

  function copyAdvice(advice) {
    var L = [];
    L.push('■ 경기 중 조정 — ' + advice.phase.ko + ' ' + advice.score.gf + ':' + advice.score.ga
      + ' (상대 ' + oppLevelKo(advice.oppLevel) + ')'
      + (advice.hasStats ? ' · 전반 기록 반영' : ''));
    advice.fired.forEach(function (f) {
      L.push('');
      L.push('[' + (f.tier === 'key' ? '핵심' : '참고') + '/' + f.group + '] ' + f.why);
      f.items.forEach(function (i) {
        L.push('  · (' + (KIND_KO[i.kind] || i.kind) + ') ' + i.text);
        if (i.why) L.push('      → ' + i.why);
      });
    });
    if (!advice.fired.length) L.push('  손댈 것이 없습니다 — 하던 대로 두세요.');
    writeClipboard(L.join('\n'));
  }

  // ── 안내 탭 ─────────────────────────────────────────────────────────────
  RENDER.guide = function (root) {
    root.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: 'FM24에서 스쿼드 내보내기' }),
      h('div', { class: 'desc', text: '게임을 고치지 않고 FM에 이미 들어 있는 기능만 씁니다.' }),
      h('div', { class: 'body', style: 'font-size:13px;color:var(--dim);line-height:1.75' }, [
        h('ol', {}, [
          h('li', {}, [h('strong', { text: '스쿼드 화면을 엽니다.' }), ' 팀 → 스쿼드']),
          h('li', {}, [h('strong', { text: '보기를 능력치가 보이도록 바꿉니다.' }),

          h('li', {}, [h('strong', { text: '내보냅니다.' }),
            ' 화면 오른쪽 위 인쇄 아이콘(또는 ', h('code', { text: 'Ctrl+P' }), ') → ',
            h('code', { text: '웹 페이지' }), ' 또는 ', h('code', { text: '텍스트 파일' }), '을 고릅니다.']),
          h('li', {}, [h('strong', { text: '여기로 가져옵니다.' }),
            ' 「스쿼드」 탭에서 그 파일을 선택하면 끝입니다.'])
        ]),
        h('p', {}, ['열이 많을수록 정확해집니다. 최소한 ', h('strong', { text: '이름 · 포지션' }),
          '은 있어야 하고, 능력치가 없으면 역할 추천이 포지션만 보고 이루어집니다.']),
        h('p', {}, [h('strong', { text: '열이 많아 화면이 좁으면 두 번에 나눠 내보내도 됩니다.' }),
          ' 예를 들어 1차는 이름·포지션·기술·정신, 2차는 이름·포지션·신체·골키퍼로 보기를 만들어 각각 내보낸 뒤 둘 다 가져오세요. ',
          '이름이 같으면 덮어쓰지 않고 능력치가 합쳐집니다.']),
        h('p', {}, [h('strong', { text: '이미 능력치 없이 가져왔다면' }),
          ' — 능력치 열을 넣어 다시 내보내 가져오면 기존 선수에 능력치만 채워집니다(선수가 중복 생성되지 않습니다). ',
          '그게 번거로우면 선수 목록의 ', h('code', { text: '편집 → 간편 입력' }),
          '에서 47개 대신 9개 항목만 넣어도 됩니다. 그렇게 채운 값은 ',
          h('strong', { text: '추정값으로 표시' }), '되고, 나중에 진짜 능력치를 가져오면 그 표시가 사라집니다.'])
      ])
    ]));

    root.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: '「모드」로 만들 수 있는 것과 없는 것' }),
      h('div', { class: 'body', style: 'font-size:13px;color:var(--dim);line-height:1.75' }, [
        h('p', {}, ['FM24에는 스크립트를 실행하는 플러그인 구조가 없습니다. 스킨(XML)은 화면 배치와 색을 바꿀 뿐 계산을 하지 못하고, 에디터 파일은 데이터베이스를 고칠 뿐입니다. ',
          h('strong', { text: '게임 안에서 전술을 계산해 조언하는 모드는 기술적으로 만들 수 없습니다.' })]),
        h('p', {}, ['그래서 이 도구는 FM 옆에서 같이 켜 두는 방식입니다. 데이터는 FM이 공식적으로 제공하는 내보내기로 가져오므로 세이브 파일을 건드리지 않고, 게임 무결성에도 영향이 없습니다.']),
        h('ul', {}, [
          h('li', {}, [h('strong', { text: '가능' }), ' — 스킨/그래픽 교체, 데이터베이스 수정(에디터), 보기·필터 저장, 화면 내보내기']),
          h('li', {}, [h('strong', { text: '불가능' }), ' — 게임 안에서 동작하는 계산 로직, 실시간 전술 조언 오버레이, 전술 파일(.fmf) 자동 생성'])
        ])
      ])
    ]));

    root.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: '엔진이 답을 만드는 순서' }),
      h('div', { class: 'body', style: 'font-size:13px;color:var(--dim);line-height:1.75' }, [
        h('ol', {}, [
          h('li', {}, ['상대 전술과 경기 상황에서 ', h('strong', { text: '규칙' }), '을 발동시킵니다. 각 규칙은 지시 축을 밀고 그 이유를 남깁니다.']),
          h('li', {}, ['규칙이 준 점수로 ', h('strong', { text: '전술 방향' }), '(뒷공간 침투 · 점유 · 측면 · 역습 · 압박 · 블록 · 중앙 과부하)을 정합니다.']),
          h('li', {}, ['포메이션 20종 각각에 대해 선발을 짜 보고, ', h('strong', { text: '스쿼드 적합도 · 상대와의 인원 맞물림 · 방향 적합도' }), '를 합해 순위를 냅니다.']),
          h('li', {}, ['자리마다 역할과 임무를 고른 뒤 선수를 ', h('strong', { text: '전체 최적' }), '으로 배정합니다. 앞자리부터 좋은 선수를 가져가면 뒷자리의 유일한 적임자가 사라지기 때문입니다.']),
          h('li', {}, ['팀으로 성립하지 않는 조합(수비 안 하는 역할 둘, 플레이메이커 셋, 양쪽 측면 동시 전진 …)에 감점을 주고 다시 맞춥니다.']),
          h('li', {}, ['마지막으로 축을 FM 라벨로 바꾸고, 서로 배타적인 지시는 하나만 남깁니다.'])
        ]),
        h('p', {}, ['모든 지시 줄을 누르면 그 값이 나온 근거가 그대로 나옵니다. 동의하지 않는 근거가 있으면 그 항목만 FM에서 직접 바꾸면 됩니다 — 이 도구는 답을 주기보다 왜 그런지를 보여 주려고 만들었습니다.'])
      ])
    ]));

    root.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: '데이터' }),
      h('div', { class: 'small muted' }, [
        '역할 ' + RD.ROLES.length + '종 · 포메이션 ' + FD.FORMATIONS.length + '종 · 대응 규칙 ' + TD.RULES.length +
        '개 · 상대 성향 ' + TD.OPP_TRAITS.length + '종. 모든 데이터는 이 기기 안에만 저장되고 어디로도 전송되지 않습니다.'
      ]),
      h('div', { class: 'row', style: 'margin-top:11px' }, [
        h('button', { class: 'btn sm ghost', onclick: exportJson }, ['설정·스쿼드 내보내기(JSON)']),
        (function () {
          var input = h('input', {
            type: 'file', accept: '.json', style: 'display:none',
            onchange: function (ev) {
              var f = ev.target.files && ev.target.files[0];
              if (!f) return;
              var fr = new FileReader();
              fr.onload = function () {
                try {
                  var d = JSON.parse(String(fr.result));
                  if (d.players) S.players = d.players;
                  if (d.opponent) Object.assign(S.opponent, d.opponent);
                  if (d.context) Object.assign(S.context, d.context);
                  if (d.standing) S.standing = d.standing;
                  if (d.pinnedFormation !== undefined) S.pinnedFormation = d.pinnedFormation;
                  if (d.opponentSquad) S.opponentSquad = d.opponentSquad;
                  if (d.match) Object.assign(S.match, d.match);
                  S._baseCache = null; S._needsCache = null;
                  save(); render(); toast('불러왔습니다.');
                } catch (e) { toast('파일을 읽지 못했습니다.'); }
              };
              fr.readAsText(f, 'utf-8');
              ev.target.value = '';
            }
          });
          return h('span', {}, [input, h('button', { class: 'btn sm ghost', onclick: function () { input.click(); } }, ['불러오기'])]);
        })()
      ])
    ]));
  };

  /*
   * 백업에는 화면에서 손으로 정한 것이 전부 들어가야 합니다.
   * 예전에는 players/opponent/context만 담아서, 리그 내 위치와 고정한 포메이션이
   * 조용히 빠졌습니다 — 브라우저 데이터를 지우면 그 설정만 복구가 안 됐습니다.
   */
  function exportJson() {
    var blob = new Blob([JSON.stringify({
      version: 2,
      players: S.players, opponent: S.opponent, context: S.context,
      standing: S.standing, pinnedFormation: S.pinnedFormation,
      opponentSquad: S.opponentSquad, match: S.match
    }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fm24-tactics.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ── 전술 텍스트 복사 ────────────────────────────────────────────────────
  function copyPlan(res) {
    var L = [];
    L.push('■ FM24 전술 — ' + res.xi.formation.ko + ' / ' + res.plans.top.map(function (p) { return p.ko; }).join(' + '));
    L.push('상대: ' + (res.opponentFormation ? res.opponentFormation.ko : '모름'));
    L.push('');
    L.push('[선발과 역할]');
    res.xi.lineup.forEach(function (l) {
      L.push('  ' + posLabel(l.slot).padEnd(6) + ' ' + l.role.ko + ' / ' + RD.DUTIES[l.duty].ko +
        '  —  ' + (l.player ? l.player.name : '(미배정)') + (l.fit != null ? ' (' + l.fit + ')' : ''));
    });
    L.push('');
    L.push('[팀 지시]');
    ['core', 'ip', 'tr', 'ood'].forEach(function (g) {
      var rows = [];
      Object.keys(res.instructions.axes).forEach(function (k) {
        var a = res.instructions.axes[k];
        if (a.group === g && a.shifted) rows.push('  ' + a.ko + ': ' + a.label);
      });
      Object.keys(res.instructions.toggles).forEach(function (k) {
        var t = res.instructions.toggles[k];
        if (t.group === g && t.on) rows.push('  ' + t.ko + ': 켜기');
      });
      if (rows.length) { L.push(' <' + TD.GROUP_KO[g] + '>'); rows.forEach(function (r) { L.push(r); }); }
    });
    if (res.individual.length) {
      L.push('');
      L.push('[개인 지시]');
      res.individual.forEach(function (p) {
        L.push('  ' + (p.player ? p.player.name : posLabel(p.slot)) + ' (' + p.role.ko + '/' + RD.DUTIES[p.duty].ko + ')');
        p.items.forEach(function (it) { L.push('    - ' + it.text + (it.locked ? ' (역할 고정)' : '')); });
      });
    }
    var brief = res.brief.key.concat(res.brief.normal);
    if (brief.length) {
      L.push('');
      L.push('[상대 대응]');
      brief.forEach(function (b) { L.push('  · ' + b.why + (b.action ? '\n      → ' + b.action : '')); });
    }
    if (res.warnings.length) {
      L.push('');
      L.push('[점검할 점]');
      res.warnings.forEach(function (w) {
        L.push('  ! ' + w.text);
        if (w.fix) L.push('      → ' + w.fix);
      });
    }
    appendSetPieces(L, res.xi);
    writeClipboard(L.join('\n'));
  }


  function writeClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('전술을 복사했습니다.'); },
        function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('전술을 복사했습니다.'); }
    catch (e) { toast('복사하지 못했습니다.'); }
    document.body.removeChild(ta);
  }

  // ── 예시 스쿼드 ─────────────────────────────────────────────────────────
  function loadDemo() {
    if (S.players.length && !confirm('지금 스쿼드에 예시 선수를 추가합니다. 계속할까요?')) return;
    S.players = S.players.concat(demoSquad());
    save(); render(); toast('예시 스쿼드를 넣었습니다.');
  }

      var attrs = {};
      RD.ATTR_ORDER.forEach(function (id) { attrs[id] = base; });
      Object.keys(over).forEach(function (k) { attrs[k] = over[k]; });
      return { id: 'demo_' + name, name: name, positions: positions, foot: foot, attrs: attrs };
    }
    return [
      mk('예시 골키퍼', ['GK'], 'R', 11, { ref: 15, han: 14, cmd: 13, com: 13, kic: 13, ono: 14, tro: 13, aer: 14, cnt: 14, pos: 14, agi: 14 }),

      mk('예시 오른풀백', ['DR', 'WBR'], 'R', 11, { cro: 14, tck: 13, mar: 13, sta: 16, wor: 15, pac: 15, acc: 15, otb: 13, tea: 14, ant: 13, dri: 13 }),
      mk('예시 왼풀백', ['DL', 'WBL'], 'L', 11, { cro: 13, tck: 14, mar: 14, sta: 15, wor: 14, pac: 13, acc: 13, pos: 14, cnt: 13, dec: 13 }),
      mk('예시 수미A', ['DM', 'MC'], 'R', 11, { tck: 15, mar: 14, pos: 16, ant: 15, cnt: 14, tea: 15, wor: 15, cmp: 13, dec: 14, str: 13, agg: 13 }),
      mk('예시 수미B', ['DM', 'MC'], 'R', 11, { pas: 16, fir: 15, tec: 15, vis: 16, dec: 15, cmp: 15, tea: 14, ant: 13, pos: 13 }),
      mk('예시 중미A', ['MC'], 'R', 11, { pas: 14, fir: 14, tck: 13, otb: 14, wor: 16, sta: 16, str: 13, ant: 13, dec: 13, lon: 13 }),
      mk('예시 중미B', ['MC', 'AMC'], 'L', 11, { pas: 15, fir: 15, tec: 16, vis: 15, dri: 14, fla: 15, dec: 14, cmp: 14, agi: 15, otb: 13 }),
      mk('예시 공미', ['AMC'], 'R', 11, { pas: 14, fir: 15, tec: 15, otb: 16, ant: 15, fin: 14, dri: 14, acc: 15, agi: 15, bal: 14, cmp: 14 }),
      mk('예시 오른윙', ['AMR', 'MR'], 'R', 11, { cro: 15, dri: 16, tec: 15, otb: 14, acc: 16, pac: 16, agi: 15, bal: 14, wor: 13, ant: 13, fla: 14 }),
      mk('예시 왼윙', ['AML', 'ML'], 'R', 11, { dri: 16, fin: 15, tec: 15, otb: 15, ant: 14, acc: 16, pac: 16, agi: 16, bal: 15, cmp: 14, fla: 14 }),
      mk('예시 왼측미', ['AML', 'ML'], 'L', 10, { cro: 14, dri: 13, wor: 15, sta: 15, tck: 12, mar: 12, tea: 13, pos: 12 }),
      mk('예시 공격수A', ['ST'], 'R', 11, { fin: 17, otb: 16, ant: 16, cmp: 15, dri: 14, fir: 14, acc: 16, pac: 16, tec: 14, dec: 14 }),
      mk('예시 공격수B', ['ST'], 'R', 11, { hea: 17, str: 17, jum: 17, bra: 15, fin: 14, otb: 13, tea: 14, wor: 14, bal: 14, fir: 13, agg: 13 }),
      mk('예시 유틸', ['MC', 'DM', 'DC'], 'R', 10, { tck: 13, pas: 12, wor: 14, sta: 14, tea: 13, pos: 12 }),
      mk('예시 측면백업', ['MR', 'AMR', 'WBR'], 'R', 10, { cro: 13, sta: 15, wor: 14, tck: 12, pac: 14, acc: 14 })
    ];
  }

  // ── 서비스 워커 ─────────────────────────────────────────────────────────
  // 새 버전이 준비되면 곧바로 넘겨받습니다. 예전에는 캐시 우선이라 한 번 연
  // 사람에게 계속 옛 버전이 나갔고, 고친 내용이 전달되지 않았습니다.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              toast('새 버전이 준비됐습니다. 새로고침하세요.');
            }
          });
        });
        reg.update();
      }).catch(function () { /* 오프라인 캐시는 없어도 동작합니다 */ });
    });
  }

  load();
  // 겹쳐 보기는 실행 방식으로 결정되는 값이라 저장하지 않고 주소에서만 읽습니다.
  // (?overlay=1 로 바로 띄우는 바로가기를 만들어 두는 용도)
  if (/[?&]overlay=1/.test(location.search)) S.overlay = true;
  document.getElementById('overlayToggle').addEventListener('click', function () {
    S.overlay = !S.overlay;
    render();
    window.scrollTo(0, 0);
  });
  render();
})();
</script>
