<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="풋볼매니저 2024 맞춤형 전술 생성기 — 내 스쿼드와 상대 전술을 넣으면 포메이션·역할·임무·팀 지시·개인 지시와 상대 대응 전략을 만들어 줍니다.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FM24 전술">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>FM24 맞춤형 전술 생성기</title>
<style>
:root{
  --bg:#0a0e14; --panel:#111823; --panel2:#18202d; --panel3:#1e2836;
  --line:#26324a; --line2:#334259;
  --text:#e7eef8; --dim:#8fa0ba; --dim2:#647691;
  --acc:#4ade80; --acc2:#38bdf8; --warn:#fbbf24; --danger:#f87171; --violet:#a78bfa;
  --duty-d:#60a5fa; --duty-s:#fbbf24; --duty-a:#f87171;
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",
        "Malgun Gothic",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.6; padding-bottom:env(safe-area-inset-bottom);
  overflow-wrap:break-word;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.35}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--acc2)}

.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;z-index:99;background:var(--acc);color:#04140a;padding:8px 14px;border-radius:8px}

/* ── 헤더 ── */
.top{
  position:sticky;top:0;z-index:30;background:rgba(10,14,20,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:10px 14px calc(env(safe-area-inset-top,0px)*0 + 0px);
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.top .brand{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.top .brand svg{width:24px;height:24px;flex:0 0 auto}
.top h1{font-size:16px;letter-spacing:-.2px}
.top .sub{font-size:11.5px;color:var(--dim2);font-weight:500}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;background:transparent;border:1px solid transparent;
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--dim);
  white-space:nowrap;transition:.14s;
}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-current="true"]{background:var(--panel3);border-color:var(--line2);color:var(--text)}
nav.tabs .badge{
  display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:999px;
  background:var(--line2);font-size:10.5px;font-weight:700;color:var(--text);text-align:center;
}

main{max-width:1080px;margin:0 auto;padding:14px}
section[hidden]{display:none}

/* ── 카드 ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card > h2{font-size:14.5px;margin-bottom:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card > .desc{font-size:12.5px;color:var(--dim2);margin-bottom:11px}
.card.tight{padding:11px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--dim2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}

/* ── 버튼 ── */
.btn{
  background:var(--panel3);border:1px solid var(--line2);border-radius:9px;
  padding:8px 13px;font-size:13.5px;font-weight:600;transition:.14s;
}
.btn:hover{border-color:var(--dim2);background:var(--panel2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04140a}
.btn.pri:hover{background:#6ee7a0;border-color:#6ee7a0}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
#overlayToggle{white-space:nowrap;flex:0 0 auto}
.btn.danger{color:var(--danger);border-color:#4a2530}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── 입력 ── */
label.f{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:4px}
input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:-1px;border-color:transparent}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5}
.field{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}

/* 세그먼트 선택 */
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);border:0;padding:7px 6px;font-size:12.5px;font-weight:600;color:var(--dim);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc2);color:#031722}

/* 슬라이더 */
.slider{margin-bottom:13px}
.slider .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.slider .lab b{font-size:12.5px;font-weight:600;color:var(--dim)}
.slider .lab span{font-size:12.5px;font-weight:700;color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc2);background:transparent}

/* 체크 태그 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--panel2);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;
  color:var(--dim);transition:.14s;
}
.chip:hover{border-color:var(--dim2)}
.chip[aria-pressed="true"]{background:rgba(74,222,128,.13);border-color:var(--acc);color:var(--acc)}

/* ── 피치 ── */
.pitch{
  position:relative;width:100%;aspect-ratio:68/100;max-width:430px;margin:0 auto;
  background:linear-gradient(180deg,#12351f 0%,#0f2c1a 55%,#0d2716 100%);
  border:1px solid #1f4a2d;border-radius:10px;overflow:hidden;
}
.pitch .line{position:absolute;background:rgba(255,255,255,.13)}
.pitch .hline{left:0;right:0;height:1px}
.pitch .box{position:absolute;border:1px solid rgba(255,255,255,.13);border-top:0}
.pitch .circle{
  position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.13);border-radius:50%;
}
.pl{
  position:absolute;transform:translate(-50%,-50%);width:66px;text-align:center;
}
.pl .bubble{
  background:var(--panel3);border:1.5px solid var(--line2);border-radius:9px;
  padding:3px 2px 4px;box-shadow:0 2px 8px rgba(0,0,0,.45);
}
.pl.d .bubble{border-color:var(--duty-d)}
.pl.s .bubble{border-color:var(--duty-s)}
.pl.a .bubble{border-color:var(--duty-a)}
.pl .rl{font-size:10.5px;font-weight:800;letter-spacing:.2px;line-height:1.3}
.pl .dt{font-size:9px;font-weight:700;line-height:1.25;opacity:.85}
.pl.d .dt{color:var(--duty-d)} .pl.s .dt{color:var(--duty-s)} .pl.a .dt{color:var(--duty-a)}
/* 이름은 두 줄까지 접습니다 — 한 줄로 자르면 「예시 공격…」처럼 구분되는 부분이 잘립니다. */
.pl .nm{font-size:9.5px;color:#cfe0f2;margin-top:2px;line-height:1.22;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  max-height:2.5em;word-break:keep-all}
.pl .fitbar{height:2px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:2px;overflow:hidden}
.pl .fitbar i{display:block;height:100%;background:var(--acc)}
.pitch.mini{aspect-ratio:68/94;max-width:none}
.pitch.mini .dot{
  position:absolute;width:9px;height:9px;border-radius:50%;background:var(--acc);
  transform:translate(-50%,-50%);
}

/* ── 결과 ── */
.summary{display:grid;grid-template-columns:repeat(4,auto);gap:6px 20px;margin-bottom:11px}
.summary .sv{font-size:18px;font-weight:800;line-height:1.3}
@media(max-width:620px){
  .summary{grid-template-columns:1fr 1fr;gap:8px 14px}
  .summary .sv{font-size:16.5px}
}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--dim2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.lineup{display:flex;flex-direction:column;gap:6px}
.lu{
  display:flex;gap:9px;align-items:flex-start;background:var(--panel2);
  border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:8px 10px;
}
.lu.d{border-left-color:var(--duty-d)} .lu.s{border-left-color:var(--duty-s)} .lu.a{border-left-color:var(--duty-a)}
.lu .pos{flex:0 0 46px;font-size:11px;font-weight:800;color:var(--dim2);padding-top:2px}
.lu .mid{flex:1 1 auto;min-width:0}
.lu .role{font-size:13.5px;font-weight:700}
.lu .role em{font-style:normal;font-size:11.5px;font-weight:700;margin-left:5px}
.lu.d .role em{color:var(--duty-d)} .lu.s .role em{color:var(--duty-s)} .lu.a .role em{color:var(--duty-a)}
.lu .who{font-size:12.5px;color:var(--dim);margin-top:1px}
.lu .note{font-size:11.5px;color:var(--dim2);margin-top:4px;line-height:1.5}
.lu .fit{flex:0 0 42px;text-align:right;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.lu .fit small{display:block;font-size:9.5px;font-weight:600;color:var(--dim2)}

.instr{display:flex;flex-direction:column;gap:5px}
.ins{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
}
.ins > button{
  display:flex;width:100%;gap:9px;align-items:center;background:transparent;border:0;
  padding:8px 11px;text-align:left;
}
.ins .k{flex:1 1 auto;font-size:13px;font-weight:600;min-width:0}
.ins .v{font-size:12.5px;font-weight:700;color:var(--acc2);white-space:nowrap}
.ins.on .v{color:var(--acc)}
.ins.def .v{color:var(--dim2)}
.ins .caret{color:var(--dim2);font-size:10px;flex:0 0 auto}
.ins .why{padding:0 11px 10px 11px;font-size:12px;color:var(--dim);border-top:1px solid var(--line)}
.ins .why ul{margin:8px 0 0;padding-left:16px}
.ins .why li{margin-bottom:3px}
.ins .why .dd{color:var(--dim2);font-variant-numeric:tabular-nums}

.brief{display:flex;flex-direction:column;gap:9px}
.bi{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.bi.key{border-color:#2c4a35;background:rgba(74,222,128,.055)}
.bi .g{font-size:10.5px;font-weight:800;color:var(--dim2);letter-spacing:.4px;margin-bottom:3px}
.bi .w{font-size:13px;font-weight:600;margin-bottom:5px}
.bi .a{font-size:12.5px;color:var(--dim);line-height:1.6}

.warn{display:flex;gap:8px;background:rgba(251,191,36,.08);border:1px solid #4a3c17;
  border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.55;margin-bottom:6px}
.warn.high{background:rgba(248,113,113,.08);border-color:#4a2226}
.warn .ic{flex:0 0 auto;font-weight:800}
.warn.high .ic{color:var(--danger)} .warn .ic{color:var(--warn)}
.fixnote{display:block;margin-top:4px;color:var(--dim);font-size:12px}
details.card>summary{list-style:none;display:flex;align-items:baseline;gap:2px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'▾';margin-left:auto;color:var(--dim2);font-size:11px}
details.card[open]>summary::after{content:'▴'}

.pi{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px}
.pi h4{font-size:13px;margin-bottom:6px}
.pi h4 small{font-weight:600;color:var(--dim2);margin-left:6px;font-size:11.5px}
.pi ul{margin:0;padding-left:0;list-style:none}
.pi li{margin-bottom:6px;font-size:12.5px}
.pi li b{display:inline-block;background:var(--panel3);border:1px solid var(--line2);
  border-radius:6px;padding:1px 7px;font-size:12px;margin-right:6px}
.pi li.lock b{border-style:dashed;color:var(--dim)}
.pi li .r{color:var(--dim2);font-size:11.5px;display:block;margin-top:2px}

.fopt{
  display:flex;gap:9px;align-items:center;width:100%;text-align:left;
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:6px;
}
.fopt[aria-pressed="true"]{border-color:var(--acc);background:rgba(74,222,128,.07)}
.fopt .n{flex:1 1 auto;min-width:0}
.fopt .n b{font-size:13.5px}
.fopt .n span{display:block;font-size:11.5px;color:var(--dim2);margin-top:1px}
.fopt .sc{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.fbtn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center}
.fbtn[aria-pressed="true"]{border-color:var(--acc2);background:rgba(56,189,248,.1)}
.fbtn .fb-pitch{position:relative;width:100%;aspect-ratio:68/94;background:#12251a;border-radius:5px;margin-bottom:5px}
.fbtn .fb-pitch i{position:absolute;width:6px;height:6px;border-radius:50%;background:#5fbf85;transform:translate(-50%,-50%)}
.fbtn b{font-size:11.5px;font-weight:700}

/* 선수 목록 */
.plist{display:flex;flex-direction:column;gap:5px}
.prow{display:flex;gap:9px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px}
.prow .nm{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ps{font-size:11px;color:var(--dim2);font-weight:600}
.prow .cov{flex:0 0 auto;font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
.prow .cov b{color:var(--acc)}

.attrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.attrgrid .a{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:3px 4px 3px 8px}
.attrgrid .a label{flex:1 1 auto;font-size:11.5px;color:var(--dim);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attrgrid .a input{width:44px;flex:0 0 auto;padding:3px 5px;text-align:center;font-size:12.5px}
.agroup{margin-bottom:11px}
.agroup > .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.agroup > .h b{font-size:12px;color:var(--dim)}

.rep{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font-size:12.5px;line-height:1.65;margin-top:10px}
.statrows{display:flex;flex-direction:column;gap:2px}
.statrow{display:flex;align-items:baseline;gap:8px;padding:2px 0;border-bottom:1px solid rgba(38,50,74,.5)}
.statrow:last-child{border-bottom:0}
.statrow .us{flex:0 0 62px;text-align:right;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.statrow .lb{flex:1 1 auto;text-align:center;font-size:11.5px;color:var(--dim2)}
.statrow .them{flex:0 0 62px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.dropzone{transition:border-color .15s,background .15s}
.dropzone.dragging{border-color:var(--acc);background:rgba(74,222,128,.06)}
.rep.err{border-color:#4a2226;background:rgba(248,113,113,.07)}
.rep b{color:var(--acc)}

details.help{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;margin-bottom:8px}
details.help summary{cursor:pointer;font-size:13.5px;font-weight:600;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:"▸ ";color:var(--dim2)}
details.help[open] summary::before{content:"▾ "}
details.help .body{font-size:13px;color:var(--dim);line-height:1.7;margin-top:9px}
details.help .body ol,details.help .body ul{padding-left:19px;margin:7px 0}
details.help .body li{margin-bottom:5px}
details.help .body code{background:var(--panel3);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
details.help .body strong{color:var(--text)}

.empty{text-align:center;padding:26px 14px;color:var(--dim2);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:5px}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);
  background:var(--panel3);border:1px solid var(--line2);border-radius:10px;
  padding:10px 18px;font-size:13px;font-weight:600;z-index:60;transition:transform .22s;
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:calc(100vw - 32px);
}
.toast.show{transform:translateX(-50%) translateY(0)}

.sticky-actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(10,14,20,0),rgba(10,14,20,.96) 34%);
  padding:14px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:4px;z-index:20}

/* ── 오버레이 모드 ──
   FM 창 위에 항상 띄워 두고 곁눈질하는 용도. 화면을 좁게 쓰므로 설명을 걷어내고
   경기 중에 실제로 눈이 가는 것(선발·바꿀 지시·핵심 대응)만 남깁니다. */
body.overlay{font-size:13px}
body.overlay .top{padding:7px 10px}
body.overlay .top .brand{margin-bottom:0}
body.overlay .top .brand svg{width:18px;height:18px}
body.overlay .top h1{font-size:12.5px}
body.overlay .top .sub,body.overlay nav.tabs{display:none}
body.overlay main{padding:8px}
body.overlay .card{padding:9px 10px;margin-bottom:7px;border-radius:9px}
body.overlay .card > h2{font-size:12px;margin-bottom:6px}
.ov{display:flex;flex-direction:column;gap:2px}
.ov .r{display:flex;gap:7px;align-items:baseline;padding:2px 0;border-bottom:1px solid rgba(38,50,74,.5)}
.ov .r:last-child{border-bottom:0}
.ov .r .p{flex:0 0 40px;font-size:10px;font-weight:800;color:var(--dim2)}
.ov .r .rr{flex:1 1 auto;font-size:12px;font-weight:700;min-width:0}
.ov .r .rr em{font-style:normal;font-size:10.5px;margin-left:4px}
.ov .r.d .rr em{color:var(--duty-d)} .ov .r.s .rr em{color:var(--duty-s)} .ov .r.a .rr em{color:var(--duty-a)}
.ov .r .nn{flex:0 0 auto;max-width:44%;font-size:11px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovi{display:flex;flex-wrap:wrap;gap:4px}
.ovi span{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:11.5px;font-weight:600}
.ovi span b{color:var(--acc2);font-weight:800;margin-left:4px}
.ovi span.on{border-color:#2c4a35;color:var(--acc)}
.ovb{font-size:11.5px;color:var(--dim);line-height:1.55;margin-bottom:5px}
.ovb b{color:var(--text);display:block;font-size:12px}
</style>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#4ade80" stroke-width="1.6"/><path d="M12 6.6l3.4 2.5-1.3 4h-4.2l-1.3-4z" fill="#4ade80"/><path d="M12 2.4v4.2M4.1 9.1l4 2.9M19.9 9.1l-4 2.9M7.4 20.4l2.5-7.3M16.6 20.4l-2.5-7.3" stroke="#4ade80" stroke-width="1.2" fill="none"/></svg>
    <div class="grow">
      <h1>FM24 맞춤형 전술 생성기</h1>
      <div class="sub">스쿼드 · 상대 전술 → 포메이션 · 역할 · 팀 지시 · 개인 지시</div>
    </div>
    <button class="btn sm ghost" id="overlayToggle" title="FM 창 위에 겹쳐 두는 좁은 보기">겹쳐 보기</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="화면 전환"></nav>
</header>

<main id="main">
  <section id="tab-squad"></section>
  <section id="tab-base" hidden></section>
  <section id="tab-transfer" hidden></section>
  <section id="tab-opp" hidden></section>
  <section id="tab-result" hidden></section>
  <section id="tab-match" hidden></section>
  <section id="tab-guide" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/roles.js"></script>
<script src="data/formations.js"></script>
<script src="data/setpieces.js"></script>
<script src="data/tactics.js"></script>
<script src="engine.js"></script>
<script src="importer.js"></script>
<script>
(function () {
  'use strict';
  var RD = window.FM_ROLE_DATA, FD = window.FM_FORMATION_DATA,
      TD = window.FM_TACTIC_DATA, E = window.FM_ENGINE, IMP = window.FM_IMPORTER;

  // ── 상태 ────────────────────────────────────────────────────────────────
  var STORE = 'fm24tactics.v1';
  var S = {
    players: [],
    opponent: {
      formationId: '4231', mentality: 3, dline: 2, loe: 2, press: 2,
      width: 3, directness: 2, tempo: 2,
      transitionLost: 'regroup', transitionWon: 'hold', traits: [], keyPlayer: ''
    },
    context: { venue: 'home', odds: 'even', goal: 'win' },
    pinnedFormation: null,
    standing: 'mid',
    match: { phase: 'half-time', gf: 0, ga: 0, oppLevel: 'even', flags: [], stats: null, side: 'right' },
    tab: 'squad',
    editing: null,
    overlay: false,
    importReport: null,
    pendingProfiles: [],
    departed: null,
    opponentSquad: [],
    opponentReport: null
  };

  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        players: S.players, opponent: S.opponent, context: S.context,
        pinnedFormation: S.pinnedFormation, opponentSquad: S.opponentSquad, standing: S.standing, match: S.match
      }));
    } catch (e) { /* 저장 공간이 없어도 이번 세션은 그대로 씁니다 */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d.players) S.players = d.players;
      if (d.opponent) Object.assign(S.opponent, d.opponent);
      if (d.context) Object.assign(S.context, d.context);
      if (d.pinnedFormation) S.pinnedFormation = d.pinnedFormation;
      if (d.opponentSquad) S.opponentSquad = d.opponentSquad;
      if (d.standing) S.standing = d.standing;
      if (d.match) Object.assign(S.match, d.match);
    } catch (e) { /* 깨진 저장본은 무시하고 초기 상태로 */ }
  }

  // ── 도우미 ──────────────────────────────────────────────────────────────
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) el.setAttribute(k, '');
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }

  // ── 탭 ──────────────────────────────────────────────────────────────────
  var TABS = [
    { id: 'squad', ko: '스쿼드' },
    { id: 'base', ko: '기본 전술' },
    { id: 'transfer', ko: '영입' },
    { id: 'opp', ko: '상대' },
    { id: 'result', ko: '맞춤 전술' },
    { id: 'match', ko: '경기 중' },
    { id: 'guide', ko: '안내' }
  ];
  function renderTabs() {
    var nav = clear(document.getElementById('tabs'));
    TABS.forEach(function (t) {
      var kids = [document.createTextNode(t.ko)];
      if (t.id === 'squad' && S.players.length) {
        kids.push(h('span', { class: 'badge', text: String(S.players.length) }));
      }
      nav.appendChild(h('button', {
        'aria-current': S.tab === t.id ? 'true' : 'false',
        onclick: function () { S.tab = t.id; render(); window.scrollTo(0, 0); }
      }, kids));
    });
  }

  function render() {
    document.body.classList.toggle('overlay', !!S.overlay);
    var toggle = document.getElementById('overlayToggle');
    if (toggle) {
      toggle.textContent = S.overlay ? '전체 보기' : '겹쳐 보기';
      toggle.setAttribute('aria-pressed', S.overlay ? 'true' : 'false');
    }
    if (S.overlay) {
      TABS.forEach(function (t) {
        var sec = document.getElementById('tab-' + t.id);
        sec.hidden = t.id !== 'result';
      });
      var box = clear(document.getElementById('tab-result'));
      renderOverlay(box);
      return;
    }
    renderTabs();
    TABS.forEach(function (t) {
      var sec = document.getElementById('tab-' + t.id);
      sec.hidden = S.tab !== t.id;
      if (S.tab === t.id) { clear(sec); RENDER[t.id](sec); }
    });
  }

  /*
   * 겹쳐 보기 — FM 창 위에 항상 띄워 두는 좁은 보기.
   * 게임 안에 넣을 방법이 없으니(README 참고) 화면 위에 겹치는 것이 가장 가깝습니다.
   * 경기 중에 실제로 다시 보는 것만 남기고 설명은 전부 걷어냅니다.
   */
  function renderOverlay(root) {
    if (!S.players.length) {
      root.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'small muted', text: '스쿼드가 비어 있습니다. 전체 보기로 돌아가 선수를 넣어 주세요.' })
      ]));
      return;
    }
    var res;
    try {
      res = E.generate({
        players: S.players, opponent: S.opponent, context: S.context,
        allowedFormations: S.pinnedFormation ? [S.pinnedFormation] : null
      });
    } catch (err) {
      root.appendChild(h('div', { class: 'card' }, [h('div', { class: 'rep err', text: '오류: ' + (err && err.message) })]));
      return;
    }

    root.appendChild(h('div', { class: 'card' }, [
      h('div', { style: 'font-size:14px;font-weight:800' }, [
        res.xi.formation.ko,
        h('span', { style: 'color:var(--acc);margin-left:8px', text: res.plans.top.map(function (p) { return p.ko; }).join('+') }),
        h('span', { style: 'color:var(--acc2);margin-left:8px', text: res.instructions.axes.mentality.label })
      ]),
      h('div', { class: 'tiny muted', text: '상대 ' + (res.opponentFormation ? res.opponentFormation.ko : '모름') })
    ]));

    var ov = h('div', { class: 'ov' });
    res.xi.lineup.forEach(function (l) {
      var duty = l.duty === 'a' ? 'a' : (l.duty === 's' ? 's' : 'd');
      ov.appendChild(h('div', { class: 'r ' + duty }, [
        h('span', { class: 'p', text: posLabel(l.slot) }),
        h('span', { class: 'rr' }, [l.role.ko, h('em', { text: RD.DUTIES[l.duty].abbr })]),
        h('span', { class: 'nn', text: l.player ? l.player.name : '—' })
      ]));
    });
    root.appendChild(h('div', { class: 'card' }, [h('h2', { text: '선발' }), ov]));

    var chips = h('div', { class: 'ovi' });
    Object.keys(res.instructions.axes).forEach(function (k) {
      var a = res.instructions.axes[k];
      if (a.shifted) chips.appendChild(h('span', {}, [a.ko, h('b', { text: a.label })]));
    });
    Object.keys(res.instructions.toggles).forEach(function (k) {
      var t = res.instructions.toggles[k];
      if (t.on) chips.appendChild(h('span', { class: 'on', text: t.ko }));
    });
    if (!chips.childNodes.length) chips.appendChild(h('span', { text: '기본값 그대로' }));
    root.appendChild(h('div', { class: 'card' }, [h('h2', { text: '바꿀 지시' }), chips]));

    if (res.brief.key.length) {
      var bc = h('div', { class: 'card' }, [h('h2', { text: '핵심 대응' })]);
      res.brief.key.forEach(function (b) {
        bc.appendChild(h('div', { class: 'ovb' }, [h('b', { text: b.why }), b.action || '']));
      });
      root.appendChild(bc);
    }
    if (res.warnings.length) {
      var wc = h('div', { class: 'card' }, [h('h2', { text: '점검' })]);
      res.warnings.slice(0, 4).forEach(function (w) {
        wc.appendChild(h('div', { class: 'ovb', text: (w.level === 'high' ? '! ' : '· ') + w.text }));
      });
      root.appendChild(wc);
    }
    root.appendChild(h('div', { class: 'card' }, [
      h('button', { class: 'btn sm', style: 'width:100%', onclick: function () { copyPlan(res); } }, ['전술 복사'])
    ]));
  }

  // ── 피치 그리기 ─────────────────────────────────────────────────────────
  function pitchFrame(cls) {
    var p = h('div', { class: 'pitch' + (cls ? ' ' + cls : '') });
    p.appendChild(h('div', { class: 'line hline', style: 'top:50%' }));
    p.appendChild(h('div', { class: 'circle' }));
    p.appendChild(h('div', { class: 'box', style: 'left:22%;right:22%;top:0;height:15%;border-top:0;border-bottom:1px solid rgba(255,255,255,.13)' }));
    p.appendChild(h('div', { class: 'box', style: 'left:22%;right:22%;bottom:0;height:15%;border-bottom:0' }));
    return p;
  }
  // y=0이 우리 골문이므로 화면 아래쪽입니다.
  function toTop(y) { return (100 - y) + '%'; }

  function miniPitch(formation) {
    var p = h('div', { class: 'fb-pitch' });
    formation.slots.forEach(function (s) {
      p.appendChild(h('i', { style: 'left:' + s.x + '%;top:' + toTop(s.y) }));
    });
    return p;
  }

  function bigPitch(lineup) {
    var p = pitchFrame();
    lineup.forEach(function (l) {
      var duty = l.duty === 'a' ? 'a' : (l.duty === 's' ? 's' : 'd');
      var fit = l.fit == null ? 0 : l.fit;
      p.appendChild(h('div', {
        class: 'pl ' + duty,
        style: 'left:' + l.slot.x + '%;top:' + toTop(l.slot.y)
      }, [
        h('div', { class: 'bubble' }, [
          h('div', { class: 'rl', text: l.role.abbr }),
          h('div', { class: 'dt', text: RD.DUTIES[l.duty].ko }),
          h('div', { class: 'nm', text: l.player ? l.player.name : '—' }),
          h('div', { class: 'fitbar' }, [h('i', { style: 'width:' + fit + '%' })])
        ])
      ]));
    });
    return p;
  }

  // ── 스쿼드 탭 ───────────────────────────────────────────────────────────
  var RENDER = {};

  /*
   * 프로필 화면으로 들어온 능력치를 누구에게 붙일지 고릅니다.
   * 새 선수로 넣을 수도, 기존 선수를 갱신할 수도 있습니다.
   */
  function pendingProfileCard() {
    var list = S.pendingProfiles || [];
    if (!list.length) return null;
    var card = h('div', { class: 'card', style: 'border-color:#1e3a4a;background:rgba(56,189,248,.05)' }, [
      h('h2', { text: '선수 프로필 ' + list.length + '건 — 누구인가요?' }),
      h('div', { class: 'desc', text: '선수 한 명의 화면에는 이름이 들어 있지 않습니다. 새로 영입한 선수면 이름을 적어 추가하고, 기존 선수의 능력치를 갱신하는 것이면 목록에서 고르세요. 포지션도 프로필에 없으니 추가한 뒤 지정해야 합니다.' })
    ]);
    list.forEach(function (prof, idx) {
      var nameInput, sel;
      function drop() { S.pendingProfiles.splice(idx, 1); save(); render(); }
      card.appendChild(h('div', { class: 'rep', style: 'margin-top:8px' }, [
        h('div', { class: 'small', style: 'margin-bottom:8px' }, [
          h('b', { text: '능력치 ' + prof.count + '개' }),
          prof.name ? h('span', { class: 'tiny muted', text: '  · ' + prof.name }) : null,
          prof.meta && prof.meta.height ? h('span', { class: 'tiny muted', text: '  · ' + prof.meta.height + ' / ' + (prof.meta.weight || '') }) : null
        ]),
        h('div', { class: 'grid2' }, [
          h('div', {}, [
            h('label', { class: 'f', text: '새 선수로 추가' }),
            (nameInput = h('input', { type: 'text', placeholder: '선수 이름' })),
            h('button', {
              class: 'btn sm pri', style: 'margin-top:6px;width:100%',
              onclick: function () {
                var nm = (nameInput.value || '').trim();
                if (!nm) { toast('이름을 적어 주세요.'); return; }
                var merged = IMP.mergeSquad(S.players, [{
                  id: 'prof' + Date.now(), name: nm, positions: [], foot: 'B', attrs: prof.attrs
                }]);
                S.players = merged.players;
                S.editing = S.players.length - 1;
                S._baseCache = null; S._needsCache = null;
                drop();
                toast(nm + ' 추가 — 포지션을 지정해 주세요.');
              }
            }, ['추가하고 포지션 지정'])
          ]),
          h('div', {}, [
            h('label', { class: 'f', text: '기존 선수 갱신' }),
            (sel = (function () {
              var s2 = h('select');
              s2.appendChild(h('option', { value: '', text: '선수 선택…' }));
              S.players.forEach(function (p, i) {
                s2.appendChild(h('option', { value: String(i), text: p.name }));
              });
              return s2;
            })()),
            h('button', {
              class: 'btn sm', style: 'margin-top:6px;width:100%',
              onclick: function () {
                if (sel.value === '') { toast('선수를 골라 주세요.'); return; }
                var target = S.players[+sel.value];
                var merged = IMP.mergeSquad(S.players, [{ name: target.name, positions: [], attrs: prof.attrs }]);
                S.players = merged.players;
                S._baseCache = null; S._needsCache = null;
                drop();
                toast(target.name + '의 능력치를 갱신했습니다.');
              }
            }, ['이 선수 갱신'])
          ])
        ]),
        h('div', { class: 'row', style: 'margin-top:8px' }, [
          h('button', { class: 'btn sm ghost', onclick: drop }, ['버리기'])
        ])
      ]));
    });
    return card;
  }

  /*
   * 이 파일에 없던 선수 — 방출·임대로 빠졌을 수 있습니다.
   * 자동으로 지우면 묶음별로 나눠 내보낸 파일 하나만 넣어도 스쿼드가 날아갑니다.
   */
  function departedCard() {
    var d = S.departed;
    if (!d || !d.names.length) return null;
    return h('div', { class: 'card', style: 'border-color:#4a3c17;background:rgba(251,191,36,.05)' }, [
      h('h2', { text: '이 파일에 없는 선수 ' + d.names.length + '명' }),
      h('div', { class: 'desc', text: '가져온 파일에는 ' + d.fileCount + '명이 들어 있는데 아래 선수들은 없습니다. 방출·임대로 빠졌다면 지우고, 다른 화면에서 내보낸 파일이라 빠진 것뿐이면 그대로 두세요.' }),
      h('div', { class: 'chips', style: 'margin-bottom:10px' }, d.names.map(function (n) {
        return h('span', { class: 'chip', style: 'cursor:default', text: n });
      })),
      h('div', { class: 'row' }, [
        h('button', {
          class: 'btn sm danger',
          onclick: function () {
            var gone = {};
            d.names.forEach(function (n) { gone[n] = 1; });
            S.players = S.players.filter(function (p) { return !gone[p.name]; });
            S.departed = null;
            S._baseCache = null; S._needsCache = null;
            save(); render();
            toast(d.names.length + '명을 스쿼드에서 지웠습니다.');
          }
        }, ['지우기']),
        h('button', {
          class: 'btn sm ghost',
          onclick: function () { S.departed = null; save(); render(); }
        }, ['그대로 두기'])
      ])
    ]);
  }

  function importReportBox() {
    var ir = S.importReport;
    if (!ir) return h('div');
    var t = ir.totals;

    if (!t.readFiles) {
      var first = ir.files[0] || {};
      var fr = first.report || {};
      // 선수 프로필은 실패가 아니라 "이름만 더 필요한" 상태입니다.
      // 아래에 고르는 칸이 떠 있는데 위에서 실패했다고 하면 서로 어긋납니다.
      if (S.pendingProfiles && S.pendingProfiles.length) {
        return h('div', { class: 'rep' }, [
          h('div', {}, [h('b', { text: '선수 프로필로 읽었습니다. ' }),
            '스쿼드 표가 아니라 선수 한 명의 화면입니다 — 아래에서 누구인지 골라 주세요.'])
        ]);
      }
      return h('div', { class: 'rep err' }, [
        h('div', {}, [h('b', { text: '가져오지 못했습니다. ' }), fr.error || '선수를 하나도 읽지 못했습니다.']),
        fr.empty && fr.fromFm ? h('div', { class: 'small', style: 'margin-top:8px;color:var(--dim)' }, [
          h('b', { style: 'color:var(--text)', text: '내 팀 스쿼드는 전술 화면 대신 ' }),
          h('b', { style: 'color:var(--text)', text: '스쿼드 화면' }),
          h('b', { style: 'color:var(--text)', text: '에서 내보내세요.' }),
          ' 팀 → 스쿼드에서 보기에 ', h('code', { text: '이름 · 포지션 · 능력치' }),
          ' 열을 넣고 인쇄 아이콘을 누르면 표가 제대로 나옵니다. ',
          '전술 화면을 내보내야 한다면 선수 목록이 표로 보이는 상태여야 합니다 — 필드(피치) 그림만 보이는 상태에서는 표가 비어 나옵니다.'
        ]) : null,
        h('div', { class: 'tiny muted', style: 'margin-top:6px',
          text: '읽은 형식: ' + (fr.format || '?') + ' · 표 행 수: ' + (fr.rows || 0) })
      ]);
    }

    var lines = [
      h('div', {}, [
        h('b', { text: t.added + '명 추가' }),
        t.updated ? (' · 기존 선수에 능력치 ' + t.filled + '개 채움') : '',
        ' · 파일 ' + t.readFiles + '개'
      ])
    ];
    // 파일이 여럿이면 어느 파일이 무엇을 넣었는지 줄줄이 보여 줍니다.
    if (ir.files.length > 1) {
      ir.files.forEach(function (f) {
        lines.push(h('div', { class: 'tiny muted' }, [
          h('b', { style: 'color:' + (f.ok ? 'var(--dim)' : 'var(--danger)'), text: (f.name || '붙여넣기') + ' ' }),
          f.ok
            ? (f.added + '명 추가 · 능력치 ' + f.filled + '개 · 열 ' + f.report.attrColumns + '개')
            : ((f.report && f.report.error) || '읽지 못함')
        ]));
      });
    }
    if (t.noPosition && t.noPosition < t.imported) {
      lines.push(h('div', { class: 'tiny muted', text: '포지션을 못 읽은 선수 ' + t.noPosition + '명 — 직접 지정해야 배치됩니다.' }));
    }
    if (t.unknown.length) {
      lines.push(h('div', { class: 'tiny muted', text: '무시한 열: ' +
        t.unknown.slice(0, 12).map(function (c) { return c.header + (c.numeric ? '(능력치?)' : ''); }).join(', ') +
        (t.unknown.length > 12 ? ' 외 ' + (t.unknown.length - 12) + '개' : '') }));
    }
    var r = { attrColumns: t.attrColumns, imported: t.imported, noPosition: t.noPosition };
    var out = [h('div', { class: 'rep' }, lines)];

    /*
     * 포지션을 아무도 못 읽으면 선발 배치가 사실상 무작위가 됩니다 — 누가 어느
     * 자리에 설 수 있는지 모른 채 능력치만으로 세우게 되기 때문입니다.
     * 능력치가 없는 것보다 더 조용히 망가지므로 크게 알립니다.
     */
    if (r.imported && r.noPosition >= r.imported) {
      out.push(h('div', { class: 'rep err', style: 'margin-top:8px' }, [
        h('div', {}, [h('b', { text: '포지션 열이 없습니다.' }),
          ' 누가 어느 자리에 설 수 있는지 모르면 선발이 능력치만 보고 짜여 뒤죽박죽이 됩니다.']),
        h('div', { class: 'small', style: 'margin-top:7px;color:var(--dim)' }, [
          'FM 보기 편집에서 ', h('b', { style: 'color:var(--text)', text: '포지션' }), ' 열을 넣고 다시 내보내세요. ',
          h('b', { style: 'color:var(--text)', text: '「선택한 포지션」은 다릅니다' }),
          ' — 그건 전술에서 지금 배정된 자리라 대개 비어 있습니다.'
        ])
      ]));
    }
    if (r.attrColumns) return h('div', {}, out);

    // 능력치 열이 하나도 없는 경우 — 손으로 47개를 치게 두면 안 되므로
    // 무엇을 하면 되는지 여기서 바로 알려 줍니다.
    return h('div', {}, out.concat([
      h('div', { class: 'rep err', style: 'margin-top:8px' }, [
        h('div', {}, [h('b', { text: '능력치 열이 하나도 없습니다.' }),
          ' 이 상태로는 포지션만 보고 역할을 정하게 됩니다.']),
        h('div', { class: 'small', style: 'margin-top:7px;color:var(--dim)' }, [
          '가장 좋은 방법은 FM에서 ', h('b', { style: 'color:var(--text)', text: '보기 편집' }),
          '으로 능력치 열을 넣고 다시 내보내는 것입니다. 그게 번거로우면 아래 선수 목록에서 ',
          h('b', { style: 'color:var(--text)', text: '간편 입력' }),
          '으로 선수당 9개 항목만 넣어도 됩니다.'
        ]),
        h('div', { class: 'row', style: 'margin-top:9px' }, [
          h('button', { class: 'btn sm', onclick: function () { S.tab = 'guide'; render(); window.scrollTo(0, 0); } },
            ['내보내기 방법 보기'])
        ])
      ])
    ]));
  }

  RENDER.squad = function (root) {
    // 가져오기
    var ta;
    var card = h('div', { class: 'card dropzone' }, [
      h('h2', { text: '스쿼드 가져오기' }),
      h('div', { class: 'desc', text: 'FM에서 내보낸 파일(.html / .rtf)을 고르세요. 능력치 묶음별로 나눠 내보낸 파일을 여러 개 한 번에 골라도 되고, 이 카드 위로 끌어다 놓아도 됩니다. 같은 선수는 합쳐집니다.' }),
      h('div', { class: 'row', style: 'margin-bottom:9px' }, [
        filePicker('파일 선택 (여러 개 가능)', doImportFiles),
        h('button', { class: 'btn', onclick: function () { doImportMany([{ name: null, text: ta.value }]); } }, ['붙여넣은 내용 가져오기']),
        h('button', { class: 'btn ghost sm', onclick: loadDemo }, ['예시 스쿼드 넣기'])
      ]),
      (ta = h('textarea', {
        placeholder: '내보낸 HTML/RTF 내용, 또는 엑셀·구글 시트에서 복사한 표를 여기에 붙여넣으세요.',
        'aria-label': '스쿼드 데이터 붙여넣기'
      })),
      importReportBox()
    ]);
    makeDropTarget(card, doImportFiles);
    root.appendChild(card);

    function doImportFiles(fileList) { readFiles(fileList, doImportMany); }

    /*
     * 여러 파일을 한 번에 받습니다.
     *
     * FM은 열이 많으면 화면이 좁아져 능력치 묶음별로 나눠 내보내게 됩니다.
     * 그걸 하나씩 넣게 하면 여섯 번을 반복해야 하고, 중간에 하나를 빠뜨려도
     * 알기 어렵습니다. 전부 합친 뒤 파일별로 무엇이 들어왔는지 함께 보고합니다.
     */
    function doImportMany(items) {
      items = (items || []).filter(function (it) { return it && it.text && it.text.trim(); });
      if (!items.length) { toast('가져올 내용이 비어 있습니다.'); return; }

      var files = [], totals = {
        added: 0, updated: 0, filled: 0, readFiles: 0,
        attrColumns: 0, imported: 0, noPosition: 0, unknown: []
      };
      var seenUnknown = {};
      var biggest = null;
      items.forEach(function (it) {
        var res = IMP.parseSquad(it.text);
        var r = res.report;
        if (r.error || !res.players.length) {
          /*
           * 선수 한 명의 프로필 화면은 표가 세로라 스쿼드로 읽히지 않습니다.
           * 이름이 들어 있지 않으므로 능력치만 담아 두고 누구인지 물어봅니다 —
           * 이름을 지어내면 엉뚱한 선수의 능력치를 덮어씁니다.
           */
          var prof = IMP.parsePlayerProfile(it.text);
          if (!prof.error) {
            S.pendingProfiles = (S.pendingProfiles || []).concat([{
              name: it.name || null, attrs: prof.attrs, count: prof.count, meta: prof.meta
            }]);
            files.push({ name: it.name, ok: false, report: { error: '선수 한 명의 프로필로 읽었습니다 — 아래에서 누구인지 골라 주세요.' } });
            return;
          }
          files.push({ name: it.name, ok: false, report: r });
          return;
        }
        // 방출·임대 판단은 가장 많은 선수가 든 파일 하나로만 합니다.
        if (!biggest || res.players.length > biggest.length) biggest = res.players;
        var merged = IMP.mergeSquad(S.players, res.players);
        S.players = merged.players;
        files.push({
          name: it.name, ok: true, report: r,
          added: merged.added, updated: merged.updated, filled: merged.filled
        });
        totals.readFiles++;
        totals.added += merged.added;
        totals.updated += merged.updated;
        totals.filled += merged.filled;
        totals.attrColumns = Math.max(totals.attrColumns, r.attrColumns);
        totals.imported = Math.max(totals.imported, r.imported);
        (r.unknownColumns || []).forEach(function (c) {
          if (seenUnknown[c.header]) return;
          seenUnknown[c.header] = 1;
          totals.unknown.push(c);
        });
      });
      // 포지션은 합친 결과로 다시 셉니다 — 파일마다 따로 세면 한 파일에만 있어도
      // "전부 포지션 없음"으로 보고됩니다.
      totals.imported = S.players.length;
      totals.noPosition = S.players.filter(function (p) { return !(p.positions || []).length; }).length;
      totals.attrColumns = totals.attrColumns || 0;

      /*
       * 이 파일에 없는 선수 — 방출·임대로 빠졌을 수 있습니다.
       * 자동으로 지우지는 않습니다. 능력치 묶음별로 나눠 내보낸 파일 하나만 넣어도
       * 나머지가 전부 '없는 선수'가 되기 때문입니다. 판단은 사람이 합니다.
       */
      S.departed = null;
      if (biggest && biggest.length >= 11) {
        var missing = IMP.missingFrom(S.players, biggest);
        if (missing.length) S.departed = { names: missing, fileCount: biggest.length };
      }

      save();
      S.importReport = { files: files, totals: totals };
      render();
      if (totals.readFiles) toast(totals.readFiles + '개 파일을 가져왔습니다.');
    }

    var pend = pendingProfileCard();
    if (pend) root.appendChild(pend);
    var dep = departedCard();
    if (dep) root.appendChild(dep);

    // 선수 목록
    var listCard = h('div', { class: 'card' }, [
      h('h2', {}, ['선수 ', h('span', { class: 'muted small', text: '(' + S.players.length + '명)' })]),
      h('div', { class: 'desc', text: '능력치를 모르는 항목은 비워 두세요. 빈칸은 0이 아니라 「모름」으로 처리되고, 결과에 반영 정도가 표시됩니다.' })
    ]);
    if (!S.players.length) {
      listCard.appendChild(h('div', { class: 'empty' }, [
        h('b', { text: '아직 선수가 없습니다' }),
        '위에서 FM 파일을 가져오거나, 예시 스쿼드로 먼저 둘러보세요.'
      ]));
    } else {
      var list = h('div', { class: 'plist' });
      S.players.forEach(function (p, i) {
        var known = Object.keys(p.attrs || {}).filter(function (k) { return p.attrs[k] > 0; }).length;
        var est = quickCount(p);
        list.appendChild(h('div', { class: 'prow', style: p.out ? 'opacity:.5' : '' }, [
          h('div', { class: 'grow', style: 'min-width:0' }, [
            h('div', { class: 'nm', text: p.name }),
            h('div', { class: 'ps', text: ((p.positions || []).join(' · ') || '포지션 없음')
              + (est ? '  · 추정 ' + est + '개' : '')
              + (p.out ? '  · ' + (p.outReason || '이탈') + ' — 선발에서 제외' : '') })
          ]),
          h('div', { class: 'cov' }, [
            h('b', { style: known ? '' : 'color:var(--warn)', text: String(known) }),
            '/' + RD.ATTR_ORDER.length
          ]),
          h('button', {
            class: 'btn sm ghost', title: p.out ? '복귀 처리' : '부상·출전 불가로 표시',
            style: p.out ? 'color:var(--danger);border-color:#4a2226' : '',
            onclick: function () {
              if (p.out) { delete p.out; delete p.outReason; }
              else { p.out = true; p.outReason = p.outReason || '부상'; }
              S._baseCache = null; S._needsCache = null;
              save(); render();
            }
          }, [p.out ? '복귀' : '부상']),
          h('button', {
            class: 'btn sm ghost',
            onclick: function () {
              S.editing = i; render();
              var box = document.getElementById('playerEditor');
              if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, ['편집']),
          h('button', {
            class: 'btn sm ghost danger', 'aria-label': p.name + ' 삭제',
            onclick: function () { S.players.splice(i, 1); save(); render(); }
          }, ['×'])
        ]));
      });
      listCard.appendChild(list);
      listCard.appendChild(h('div', { class: 'row', style: 'margin-top:11px' }, [
        h('button', { class: 'btn sm ghost danger', onclick: function () {
          if (confirm('선수 ' + S.players.length + '명을 모두 지웁니다. 계속할까요?')) {
            S.players = []; S.editing = null; save(); render();
          }
        } }, ['전체 삭제'])
      ]));
    }
    listCard.appendChild(h('div', { class: 'row', style: 'margin-top:9px' }, [
      h('button', { class: 'btn', onclick: function () {
        S.players.push({ id: 'm' + Date.now(), name: '새 선수', positions: [], foot: 'B', attrs: {} });
        S.editing = S.players.length - 1; save(); render();
      } }, ['+ 직접 추가'])
    ]));
    root.appendChild(listCard);

    if (S.editing !== null && S.players[S.editing]) root.appendChild(playerEditor(S.players[S.editing]));

    root.appendChild(h('div', { class: 'sticky-actions' }, [
      h('button', {
        class: 'btn pri', style: 'width:100%',
        onclick: function () { S.tab = 'opp'; render(); window.scrollTo(0, 0); }
      }, ['상대 전술 입력하기 →'])
    ]));
  };

  /*
   * 간편 입력 — 47개 대신 9개.
   * 정확도는 실제 능력치보다 떨어지므로 채워 넣은 뒤 그 사실을 선수에 표시하고,
   * 결과 화면에서도 몇 명이 추정값인지 알려 줍니다. 100% 입력된 것처럼 보이면
   * 그 숫자를 그대로 믿게 되기 때문입니다.
   */
  function quickEntry(p) {
    var vals = {};
    RD.QUICK_GROUPS.forEach(function (g) {
      // 이미 값이 있으면 그 묶음의 평균을 기본값으로 보여 줍니다.
      var known = g.attrs.map(function (a) { return (p.attrs || {})[a]; })
        .filter(function (v) { return typeof v === 'number' && v > 0; });
      vals[g.id] = known.length ? Math.round(known.reduce(function (a, b) { return a + b; }, 0) / known.length) : 10;
    });

    // 추정이 아닌 '진짜' 값 — 내보내기로 가져왔거나 손으로 친 것.
    function realCount() {
      var q = p.quickAttrs || {}, a = p.attrs || {};
      return Object.keys(a).filter(function (k) { return a[k] > 0 && !q[k]; }).length;
    }

    function apply(onlyEmpty) {
      /*
       * 「전체 채우기」는 이미 들어 있는 진짜 능력치까지 묶음 평균으로 덮어씁니다.
       * 파일 여섯 개를 넣어 47개를 채워 둔 선수가 한 번의 오조작으로 전부
       * 추정값이 되고, 되돌릴 방법이 없습니다. 그래서 덮어쓸 것이 있을 때만 묻습니다.
       */
      if (!onlyEmpty) {
        var real = realCount();
        if (real > 0 && !window.confirm(
          p.name + '의 실제 능력치 ' + real + '개가 추정값으로 바뀝니다.\n'
          + '되돌릴 수 없습니다 — 비어 있는 항목만 채우려면 「빈 항목만 채우기」를 쓰세요.\n\n계속할까요?')) return;
      }
      p.attrs = p.attrs || {};
      // 어떤 값이 추정인지 능력치 단위로 기억합니다. 나중에 진짜 값을 가져오면
      // 그 표시가 하나씩 사라지고, 화면은 남은 추정 개수를 그대로 보여 줍니다.
      p.quickAttrs = p.quickAttrs || {};
      var touched = 0, replaced = 0;
      RD.QUICK_GROUPS.forEach(function (g) {
        g.attrs.forEach(function (a) {
          if (onlyEmpty && p.attrs[a] > 0) return;
          if (p.attrs[a] > 0 && !p.quickAttrs[a]) replaced++;
          p.attrs[a] = vals[g.id];
          p.quickAttrs[a] = 1;
          touched++;
        });
      });
      save(); render();
      toast(touched + '개를 추정값으로 채웠습니다'
        + (replaced ? ' (실제 값 ' + replaced + '개를 덮어썼습니다)' : '') + '.');
    }

    var grid = h('div', { class: 'attrgrid' });
    RD.QUICK_GROUPS.forEach(function (g) {
      grid.appendChild(h('div', { class: 'a', title: g.hint }, [
        h('label', { for: 'q_' + g.id, text: g.ko }),
        h('input', {
          id: 'q_' + g.id, type: 'number', min: '1', max: '20', inputmode: 'numeric',
          value: String(vals[g.id]),
          oninput: function (e) {
            var v = parseInt(e.target.value, 10);
            if (isFinite(v) && v >= 1 && v <= 20) vals[g.id] = v;
          }
        })
      ]));
    });

    return h('details', { class: 'help', open: !Object.keys(p.attrs || {}).length }, [
      h('summary', { text: '간편 입력 — 9개만 넣기' }),
      h('div', { class: 'body' }, [
        h('div', { style: 'margin-bottom:9px' },
          ['능력치 47개를 손으로 치는 대신 아래 9개만 넣으면 묶음 안의 능력치를 그 값으로 채웁니다. ',
           'FM에서 능력치 열을 넣어 다시 내보내는 편이 훨씬 정확하지만, 급할 때 쓰세요.']),
        grid,
        h('div', { class: 'row', style: 'margin-top:10px' }, [
          // 안전한 쪽을 기본으로 둡니다 — 「전체 채우기」는 있는 값을 지우는 동작입니다.
          h('button', { class: 'btn sm pri', onclick: function () { apply(true); } }, ['빈 항목만 채우기']),
          h('button', { class: 'btn sm', onclick: function () { apply(false); } }, ['전체 채우기']),
          quickCount(p)
            ? h('span', { class: 'tiny', style: 'color:var(--warn)', text: '추정값 ' + quickCount(p) + '개' })
            : null
        ])
      ])
    ]);
  }

  function playerEditor(p) {
    var card = h('div', { class: 'card', id: 'playerEditor' });
    card.appendChild(h('h2', { text: '선수 편집' }));
    card.appendChild(h('div', { class: 'grid2' }, [
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '이름' }),
        h('input', { type: 'text', value: p.name, oninput: function (e) { p.name = e.target.value; save(); } })
      ]),
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '주발' }),
        (function () {
          var seg = h('div', { class: 'seg' });
          [['R', '오른발'], ['L', '왼발'], ['B', '양발']].forEach(function (o) {
            seg.appendChild(h('button', {
              'aria-pressed': (p.foot || 'B') === o[0] ? 'true' : 'false',
              onclick: function () { p.foot = o[0]; save(); render(); }
            }, [o[1]]));
          });
          return seg;
        })()
      ])
    ]));

    card.appendChild(h('div', { class: 'field' }, [
      h('label', { class: 'f', text: '출전 가능 여부' }),
      segment([['ok', '출전 가능'], ['injury', '부상'], ['susp', '출장 정지']],
        p.out ? (p.outReason === '출장 정지' ? 'susp' : 'injury') : 'ok', function (v) {
          if (v === 'ok') { delete p.out; delete p.outReason; }
          else { p.out = true; p.outReason = v === 'susp' ? '출장 정지' : '부상'; }
          S._baseCache = null; S._needsCache = null;
          save(); render();
        })
    ]));

    card.appendChild(h('label', { class: 'f', text: '포지션 (여러 개 선택 가능)' }));
    var chips = h('div', { class: 'chips', style: 'margin-bottom:12px' });
    RD.POSITIONS.forEach(function (pos) {
      chips.appendChild(h('button', {
        class: 'chip', 'aria-pressed': (p.positions || []).indexOf(pos.id) >= 0 ? 'true' : 'false',
        onclick: function () {
          p.positions = p.positions || [];
          var i = p.positions.indexOf(pos.id);
          if (i >= 0) p.positions.splice(i, 1); else p.positions.push(pos.id);
          save(); render();
        }
      }, [pos.ko]));
    });
    card.appendChild(chips);

    card.appendChild(quickEntry(p));

    var groups = [['gk', 'GK'], ['tec', '기술'], ['men', '정신'], ['phy', '신체']];

  /*
   * 상대 데이터 읽기.
   * 같은 파일에서 두 가지를 뽑습니다 — 전술 화면이면 자리 목록에서 포메이션을,
   * 능력치가 있으면 스쿼드에서 성향을. 둘 중 하나만 나와도 그것만 반영합니다.
   */
  function readOpponentMany(items) {
    items = (items || []).filter(function (it) { return it && it.text && it.text.trim(); });
    if (!items.length) { toast('읽을 내용이 비어 있습니다.'); return; }
    var rep = { formation: null, matches: [], traits: [], players: 0, attrPlayers: 0, files: 0 };

    items.forEach(function (it) {
      var used = false;
      // 전술 화면이면 자리 목록에서 포메이션이 나옵니다. 여러 파일 중 처음 성공한
      // 것을 씁니다 — 스쿼드 화면에는 자리 목록이 없습니다.
      var lineup = IMP.parseLineup(it.text);
      if (!rep.formation && lineup.matches.length) {
        S.opponent.formationId = lineup.matches[0];
        rep.formation = lineup.matches[0];
        rep.matches = lineup.matches;
        used = true;
      } else if (!rep.formation && !rep.positions && lineup.positions.length) {
        rep.positions = lineup.positions;
      }
      // 선발 명단에는 능력치보다 값싼 정보가 있습니다 — 자리에 안 맞는 선수와
      // 컨디션이 나쁜 선수. 둘 다 어느 쪽을 노릴지 바로 알려 줍니다.
      var notes = E.opponentLineupNotes(lineup.slots);
      if (notes.length) {
        rep.lineupNotes = (rep.lineupNotes || []).concat(notes);
        S.opponent.lineupNotes = rep.lineupNotes;
        notes.forEach(function (n) {
          if (n.trait && S.opponent.traits.indexOf(n.trait) < 0) S.opponent.traits.push(n.trait);
        });
        used = true;
      }

      var squad = IMP.parseSquad(it.text);
      if (squad.players.length) {
        S.opponentSquad = IMP.mergeSquad(S.opponentSquad || [], squad.players).players;
        used = true;
      }
      if (used) rep.files++;
    });

    if (S.opponentSquad && S.opponentSquad.length) {
      rep.players = S.opponentSquad.length;
      rep.attrPlayers = S.opponentSquad.filter(function (p) { return Object.keys(p.attrs || {}).length >= 3; }).length;
      // 성향은 합쳐진 상대 스쿼드 전체로 한 번만 냅니다.
      var traits = E.inferOpponentTraits(S.opponentSquad);
      rep.traits = traits;
      traits.forEach(function (t) {
        if (S.opponent.traits.indexOf(t.id) < 0) S.opponent.traits.push(t.id);
      });
    }
    S.opponentReport = rep;
    save(); render(); window.scrollTo(0, 0);
  }

    } else if (r.attrPlayers) {
      // 능력치는 있는데 성향이 하나도 안 나왔다면 대개 포지션이 없어서입니다
      // (어느 자리 선수인지 몰라 "앞선에 빠른 선수" 같은 판단을 할 수 없습니다).
      var noPos = (S.opponentSquad || []).filter(function (p) { return !(p.positions || []).length; }).length;
      lines.push(h('div', { class: 'tiny muted', text: noPos >= r.players

        : '눈에 띄는 성향은 없습니다 — 아래에서 직접 골라도 됩니다.' }));
    }
    if (!lines.length) {
      return h('div', { class: 'rep err' }, [
        h('div', {}, [h('b', { text: '포메이션도 선수도 읽지 못했습니다.' })]),
        h('div', { class: 'small', style: 'margin-top:7px;color:var(--dim)' }, [
          '전술 화면이 ', h('b', { style: 'color:var(--text)', text: '선수 목록(표)으로 보이는 상태' }),
          '에서 내보내야 합니다. 필드(피치) 그림만 보이는 상태로 내보내면 표가 없는 빈 파일이 나옵니다 — 링크 한 줄만 들어 있습니다.'
        ])
      ]);
    }
    return h('div', { class: 'rep' }, lines);
  }

  function filePicker(label, onFiles) {
    var input = h('input', {
      type: 'file', accept: '.html,.htm,.rtf,.txt,.csv,.tsv', multiple: true,
      style: 'display:none',
      onchange: function (ev) {
        if (ev.target.files && ev.target.files.length) onFiles(ev.target.files);
        ev.target.value = '';
      }
    });
    return h('span', {}, [input, h('button', { class: 'btn', onclick: function () { input.click(); } }, [label])]);
  }

  /*
   * 파일을 순서대로 읽습니다.
   * 바이트로 읽고 인코딩을 직접 판별합니다 — UTF-16으로 내보내는 도구의 파일을
   * UTF-8로 읽으면 열 이름이 하나도 맞지 않습니다.
   */
  function readFiles(fileList, done) {
    var files = Array.prototype.slice.call(fileList);
    var out = [], i = 0;
    (function next() {
      if (i >= files.length) { done(out); return; }
      var f = files[i++];
      var fr = new FileReader();
      fr.onload = function () { out.push({ name: f.name, text: IMP.decodeBytes(fr.result) }); next(); };
      fr.onerror = function () { out.push({ name: f.name, text: null }); next(); };
      fr.readAsArrayBuffer(f);
    })();
  }

  function makeDropTarget(el, onFiles) {
    ['dragenter', 'dragover'].forEach(function (t) {
      el.addEventListener(t, function (e) { e.preventDefault(); el.classList.add('dragging'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      el.addEventListener(t, function (e) { e.preventDefault(); el.classList.remove('dragging'); });
    });
    el.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) onFiles(e.dataTransfer.files);
    });
  }

  // 한글 조사는 engine.js가 갖고 있습니다 — 결과 문장을 엔진도 만들기 때문입니다.

    ]);

  function expandable(cls, keyText, valText, reasons) {
    var why = reasonList(reasons);
    why.style.display = 'none';
    var caret = h('span', { class: 'caret', text: '▾' });
    var box = h('div', { class: cls }, [
      h('button', {
        'aria-expanded': 'false',
        onclick: function () {

          why.style.display = open ? '' : 'none';

          this.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
      }, [
        h('span', { class: 'k', text: keyText }),
        h('span', { class: 'v', text: valText }),
        caret
      ]),
      why
    ]);
    return box;
  }
