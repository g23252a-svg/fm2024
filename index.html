            : h('div', { class: 'note', style: 'color:var(--warn)', text: '이 자리에 백업이 없습니다' })
        ]),
        h('div', { class: 'fit' }, [l.fit == null ? '—' : String(l.fit), h('small', { text: '적합도' })])
      ]));
    });
    lc.appendChild(lu);
    root.appendChild(lc);

    root.appendChild(instructionsCard(res.instructions));
    if (res.individual.length) root.appendChild(individualCard(res.individual));

    var rc = h('div', { class: 'card' }, [
      h('h2', { text: '다른 후보' }),
      h('div', { class: 'desc', text: '점수 = 선수 적합도 + 역할이 방향과 맞는 정도 + 스쿼드 성격 + 교체 두께. 위 몇 개가 1~2점 차이면 실제로 다 쓸 만하다는 뜻이고, 그럴 땐 익숙한 형태를 고르는 편이 낫습니다.' })
    ]);
    res.ranking.forEach(function (c, i) {
      rc.appendChild(h('div', { class: 'fopt', style: i === 0 ? 'border-color:var(--acc)' : '' }, [
        h('div', { class: 'n' }, [
          h('b', { text: c.formationKo + ' · ' + c.planKo }),
          h('span', { text: '적합 ' + c.teamFit + ' · 역할 ' + c.planFit + ' · 스쿼드 ' +
            (c.squadBonus > 0 ? '+' : '') + c.squadBonus + ' · 위치 ' + (c.prior > 0 ? '+' : '') + c.prior +
            ' · 두께 ' + (c.depthCovered ? c.depth : '—') })
        ]),
        h('div', { class: 'sc', text: String(c.score) })
      ]));
    });
    root.appendChild(rc);

    var cov = Math.round(res.squad.coverage * 100);
    root.appendChild(h('div', { class: 'card tight' }, [
      h('div', { class: 'small muted' }, [
        '능력치 입력률 ', h('b', { style: 'color:' + (cov >= 60 ? 'var(--acc)' : 'var(--warn)'), text: cov + '%' }),
        ' · 선수 ' + res.squad.count + '명 · 선발 기준 속도 ' + res.xiSquad.pace + ' · 기술 ' + res.xiSquad.technique +
        ' · 제공권 ' + res.xiSquad.aerial + ' · 체력 ' + res.xiSquad.stamina + '. ',
        h('b', { text: '이건 "무조건 이기는 전술"이 아닙니다' }),
        ' — 우리 스쿼드가 가장 잘 수행할 수 있는 형태라는 뜻이고, 승률로 검증한 값이 아닙니다.'
      ])
    ]));
  };

  // ── 영입 탭 ─────────────────────────────────────────────────────────────
  var SEV = {
    critical: { ko: '급함', color: 'var(--danger)', bg: 'rgba(248,113,113,.08)', border: '#4a2226' },
    high: { ko: '필요', color: 'var(--warn)', bg: 'rgba(251,191,36,.07)', border: '#4a3c17' },
    mid: { ko: '있으면', color: 'var(--acc2)', bg: 'rgba(56,189,248,.06)', border: '#1e3a4a' }
  };

  RENDER.transfer = function (root) {
    if (S.players.length < 7) {
      root.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'empty' }, [
          h('b', { text: '선수가 부족합니다' }),
          '스쿼드를 먼저 가져오세요. 최소 7명이 있어야 약점을 볼 수 있습니다.'
        ])
      ]));
      return;
    }
    var sig = baseSignature();
    var rep;
    if (S._needsCache && S._needsCache.sig === sig) {
      rep = S._needsCache.rep;
    } else {
      var base = (S._baseCache && S._baseCache.sig === sig) ? S._baseCache.res : null;
      try {
        rep = E.squadNeeds({ players: S.players, standing: S.standing || 'mid', base: base });

        return;
      }
      if (!rep) return;
      S._needsCache = { sig: sig, rep: rep };
      if (!S._baseCache || S._baseCache.sig !== sig) S._baseCache = { sig: sig, res: rep.base };
    }

    /*
     * 포지션을 모르면 영입 목록을 내지 않습니다. 열한 자리를 전부 「급함」으로

        h('div', { class: 'warn high' }, [

      ])
    ]));

    if (rep.team.length) {

      rep.team.forEach(function (t) {

      });

        h('div', { class: 'empty' }, [
          h('b', { text: '급한 자리가 없습니다' }),
          '기본 전술 기준으로 모든 자리에 쓸 만한 주전과 백업이 있습니다.'
        ])
      ]));
    }

    rep.needs.forEach(function (n) {

      n.wantAttrs.forEach(function (a) {
        var lack = a.need && a.best !== null && a.best < a.need;
        attrs.appendChild(h('span', {

            : ('지금 이 자리 최고: ' + a.best)
        }, [a.ko + (a.target ? ' ' + a.target + '↑' : ''),

      });

      root.appendChild(h('div', {
        class: 'card',
        style: 'border-color:' + sv.border + ';background:' + sv.bg
      }, [

          h('span', { style: 'font-size:11px;font-weight:800;color:' + sv.color, text: sv.ko }),

        ]),

        h('div', { class: 'small' }, [

          String(n.profile).split(' — ')[0]
        ]),
        attrs,
        trainInstead(n),
        h('div', { class: 'tiny muted', style: 'margin-top:8px' }, [
          '지금: 주전 ',
          n.starter ? (n.starter.name + ' (' + n.starter.fit + (n.starter.natural ? '' : ' · 다른 자리 선수') + ')') : '없음',
          ' · 백업 ', n.backup ? (n.backup.name + ' (' + n.backup.fit + ')') : '없음',
          ' · 등록 ' + n.naturalCount + '명 / 선발 ' + n.slots + '자리'
        ])
      ]));
    });

    if (rep.surplus.length) {
      root.appendChild(h('div', { class: 'card' }, [

        h('div', { class: 'desc', text: '선발 자리보다 3명 이상 많은 포지션입니다 — 정리하거나 임대를 보내 다른 자리를 채울 여지가 있습니다.' }),
        h('div', { class: 'chips' }, rep.surplus.map(function (s) {

        ])
      ]));
    }

    root.appendChild(h('div', { class: 'card tight' }, [
      h('div', { class: 'small muted' }, [
        '요구 능력치는 역할이 성립하기 위한 최소치이고, 그 값이 없는 역할은 ',
        h('b', { text: '지금 팀 수준을 기준으로' }), ' 적었습니다(급한 자리는 한 단계 위, 백업은 비슷한 수준). ',
        'FM 스카우트 필터에 그대로 옮겨 쓸 수 있게 숫자로 냈습니다. ',
        h('b', { text: '이건 이적료를 보지 않습니다' }), ' — 어떤 선수가 필요한지까지이고, 누구를 살지는 스카우트 화면에서 정하세요.'
      ])
    ]));

    var tc = trainingCard();
    if (tc) root.appendChild(tc);
  };

  /*
   * 훈련 제안 — 영입 탭 아래에 붙입니다.
   *
   * "이 자리에 사람이 없다"의 답이 늘 영입인 것은 아닙니다. FM에서 더 싼 해법은
   * 이미 있는 선수에게 그 자리를 가르치는 것입니다. 그래서 영입 목록 바로 아래에
   * 두어 둘을 나란히 놓고 고르게 합니다.
   */
  /*
   * "이 자리는 사람을 사기 전에 가르치면 된다"를 영입 항목 바로 밑에 붙입니다.
   * 훈련 카드는 탭 맨 아래에 따로 있는데, 거기까지 내려가서 대조하는 사람은 없습니다.
   */
  function trainInstead(need) {
    var tp = trainingData();
    if (!tp) return null;
    var hit = tp.position.filter(function (t) { return t.pos === need.pos; })[0];
    if (!hit) return null;
    return h('div', { class: 'warn', style: 'margin-top:8px;background:rgba(74,222,128,.06);border-color:#2c4a35' }, [
      h('span', { class: 'ic', style: 'color:var(--acc)', text: '↺' }),
      h('span', {}, [
        '사기 전에: ' + hit.text,
        h('span', { class: 'fixnote', text: '→ ' + hit.gainText + (hit.ageNote ? ' · ' + hit.ageNote : '') }),
        hit.starterNote ? h('span', { class: 'fixnote', style: 'color:var(--warn)', text: '주의: ' + hit.starterNote }) : null
      ])
    ]);
  }

  // 영입 탭에서 두 번(항목마다 · 카드에서) 쓰므로 한 번만 계산합니다.
  function trainingData() {
    var sig = baseSignature();
    if (S._trainCache && S._trainCache.sig === sig) return S._trainCache.tp;
    var tp = null;
    try { tp = E.trainingPlan({ players: S.players, standing: S.standing || 'mid' }); } catch (e) { tp = null; }
    S._trainCache = { sig: sig, tp: tp };
    return tp;
  }

  // FM 스카우트 필터에 옮겨 적을 수 있게 글로 냅니다.
  function copyNeeds(rep) {
    var L = [];
    L.push('■ FM24 영입이 필요한 자리 — ' + rep.base.formation.ko + ' / ' + rep.base.plan.ko);
    rep.needs.forEach(function (n) {
      L.push('');
      L.push('[' + (SEV[n.severity] || {}).ko + '] ' + n.ko + ' · ' + n.role.ko + ' / ' + RD.DUTIES[n.duty].ko);
      L.push('  ' + n.reason);
      var want = n.wantAttrs.filter(function (a) { return a.target; })
        .map(function (a) { return a.ko + ' ' + a.target + '↑'; });
      if (want.length) L.push('  스카우트 필터: ' + want.join(' · '));
      L.push('  지금: 주전 ' + (n.starter ? n.starter.name + ' (' + n.starter.fit + ')' : '없음')
        + ' · 백업 ' + (n.backup ? n.backup.name + ' (' + n.backup.fit + ')' : '없음')
        + ' · 등록 ' + n.naturalCount + '명 / 선발 ' + n.slots + '자리');
      var tp = trainingData();
      var hit = tp ? tp.position.filter(function (t) { return t.pos === n.pos; })[0] : null;
      if (hit) L.push('  사기 전에: ' + hit.text + ' (' + hit.gainText + ')');
    });
    if (!rep.needs.length) L.push('  급한 자리가 없습니다.');
    writeClipboard(L.join('\n'));
  }

  function trainingCard() {
    var tp = trainingData();
    if (!tp) return null;
    if (!tp.position.length && !tp.focus.length && !tp.ageing.length) return null;

    var card = h('div', { class: 'card' }, [
      h('h2', { text: '영입 대신 훈련' }),
      h('div', { class: 'desc', text: '위 목록에 돈을 쓰기 전에, 이미 있는 선수로 메울 수 있는지 먼저 봅니다. FM 훈련 → 개인 훈련에서 설정합니다.' })
    ]);

    if (tp.position.length) {
      card.appendChild(h('div', { style: 'font-size:12px;font-weight:800;margin:12px 0 6px', text: '추가 포지션 훈련' }));
      tp.position.slice(0, 5).forEach(function (t) {
        card.appendChild(h('details', { class: 'help' }, [
          h('summary', {}, [
            h('span', { style: 'font-weight:700', text: t.text }),
            h('div', { class: 'tiny', style: 'color:var(--acc)', text: t.gainText })
          ]),
          h('div', { class: 'body' }, [
            h('div', { class: 'tiny', style: 'color:var(--dim)', text: t.why }),
            t.ageNote ? h('div', { class: 'tiny muted', style: 'margin-top:4px',
              text: (t.age ? t.age + '세 · ' : '') + t.ageNote }) : null
          ])
        ]));
      });
    }

    if (tp.ageing.length) {
      card.appendChild(h('div', { style: 'font-size:12px;font-weight:800;margin:14px 0 6px', text: '2년 뒤에 비는 자리' }));
      card.appendChild(h('div', { class: 'tiny muted', style: 'margin-bottom:6px',
        text: '지금은 멀쩡하지만 주전이 30대이고 뒤가 얇은 자리입니다. 급한 영입은 아니고, 스카우트를 미리 돌릴 자리입니다.' }));
      tp.ageing.slice(0, 5).forEach(function (a) {
        card.appendChild(h('div', { class: 'warn' }, [
          h('span', { class: 'ic', text: '·' }),
          h('span', {}, [a.text, h('span', { class: 'fixnote', text: '→ ' + a.why })])
        ]));
      });
    }

    if (tp.focus.length) {
      card.appendChild(h('div', { style: 'font-size:12px;font-weight:800;margin:14px 0 6px', text: '선발 개인 훈련 초점' }));
      tp.focus.slice(0, 8).forEach(function (f) {
        card.appendChild(h('div', { class: 'statrow', style: 'gap:8px' }, [
          h('b', { class: 'us', style: 'min-width:0;text-align:left', text: f.name }),
          h('span', { class: 'lb', style: 'text-align:left',
            text: f.attrKo + ' ' + f.have + (f.want ? ' → ' + f.want + ' 필요' : '') }),
          h('span', { class: 'them', style: 'font-size:11px;color:' + (f.kind === 'req' ? 'var(--danger)' : 'var(--dim2)'),
            text: f.kind === 'req' ? '역할 미달' : f.roleKo })
        ]));
      });
      card.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:7px',
        text: '「역할 미달」은 그 역할이 성립하기 위한 최소치를 못 넘긴 것입니다 — 훈련으로 못 메우면 그 자리는 역할을 바꾸거나 사람을 바꿔야 합니다.' }));
    }
    return card;
  }

  // ── 결과 화면 공통 조각 ─────────────────────────────────────────────────
  function fmStepsCard(plan, formation, instructions, piCount) {
    var preset = TD.FM_PRESETS[plan.id];
    var shifted = Object.keys(instructions.axes).filter(function (k) { return instructions.axes[k].shifted; }).length;
    var onCount = Object.keys(instructions.toggles).filter(function (k) { return instructions.toggles[k].on; }).length;
    var ol = h('ol', { style: 'margin:0;padding-left:19px;font-size:13px;line-height:1.85;color:var(--dim)' });
    ol.appendChild(h('li', {}, [
      '전술 유형을 고릅니다 — ',
      h('b', { style: 'color:var(--acc)', text: preset ? preset.ko : TD.FM_PRESET_BLANK }),
      preset && preset.alt ? h('span', { class: 'tiny muted', text: ' (또는 ' + preset.alt + ')' }) : null,
      h('span', { class: 'tiny muted', text: '  · 프리셋은 역할과 지시를 자기 값으로 채우니 아래와 다른 부분은 덮어쓰세요. 어긋나는 게 싫으면 「' + TD.FM_PRESET_BLANK + '」으로 백지에서 시작하면 됩니다.' })
    ]));
    ol.appendChild(h('li', {}, ['포메이션을 ', h('b', { style: 'color:var(--text)', text: formation.ko }),
      ro(formation.ko) + ' 바꿉니다.']));
    ol.appendChild(h('li', {}, ['멘탈리티를 ', h('b', { style: 'color:var(--text)', text: instructions.axes.mentality.label }),
      ro(instructions.axes.mentality.label) + ' 둡니다.']));
    ol.appendChild(h('li', {}, ['자리마다 역할과 임무를 지정합니다 (아래 ',
      h('b', { style: 'color:var(--text)', text: '포지션별 역할과 임무' }), ' 11줄).']));
    ol.appendChild(h('li', {}, ['팀 지시를 맞춥니다 — 바꿀 것은 ',
      h('b', { style: 'color:var(--text)', text: '축 ' + Math.max(0, shifted - 1) + '개 · 켤 지시 ' + onCount + '개' }), '뿐입니다.']));
    if (piCount) ol.appendChild(h('li', {}, ['개인 지시를 넣습니다 (', h('b', { style: 'color:var(--text)', text: piCount + '명' }), ').']));
    return h('div', { class: 'card' }, [
      h('h2', { text: 'FM에 옮기는 순서' }),
      h('div', { class: 'desc', text: '전술 → 기본 정보 화면에서 이 순서대로 하면 됩니다.' }),
      ol
    ]);
  }

  /*
   * 이탈 선수 때문에 달라진 것.
   * "누가 빠졌다"만 알려 주면 왜 역할이 바뀌었는지 알 수 없습니다.
   * 전원이 있었다면 어땠을지와 나란히 놓고 달라진 것만 보여 줍니다.
   */
  function injuryImpactCard(res) {
    var im = res.injuryImpact;
    if (!im) return null;
    var has = im.formation || im.plan || im.slots.length || im.instructions.length;
    if (!has) {
      return h('div', { class: 'card tight' }, [
        h('div', { class: 'small muted' }, [
          h('b', { style: 'color:var(--acc)', text: '이탈 선수가 전술을 바꾸지는 않았습니다. ' }),
          '대체 선수가 같은 역할을 수행할 수 있어 형태와 지시가 그대로입니다.'
        ])
      ]);
    }
    var card = h('div', { class: 'card', style: 'border-color:#4a3c17;background:rgba(251,191,36,.05)' }, [
      h('h2', { text: '이탈 선수로 달라진 점' }),
      h('div', { class: 'desc', text: '전원이 있었을 때와 견준 결과입니다. 대체 선수의 성격이 다르면 역할과 지시가 함께 움직입니다.' })
    ]);
    if (im.formation) {
      card.appendChild(h('div', { class: 'warn high' }, [
        h('span', { class: 'ic', text: '!' }),
        h('span', {}, ['포메이션이 ', h('b', { text: im.formation.from }), ' → ',
          h('b', { text: im.formation.to }), '으로 바뀌었습니다. 빠진 선수가 그 형태의 전제였습니다.'])
      ]));
    }
    if (im.plan) {
      card.appendChild(h('div', { class: 'warn' }, [
        h('span', { class: 'ic', text: '·' }),
        h('span', {}, ['전술 방향이 ', h('b', { text: im.plan.from }), ' → ', h('b', { text: im.plan.to }), '으로 바뀌었습니다.'])
      ]));
    }
    im.slots.forEach(function (sl) {
      var big = sl.fitDrop != null && sl.fitDrop >= 10;
      card.appendChild(h('div', { class: 'bi', style: 'margin-bottom:6px' }, [
        h('div', { class: 'g', text: posLabel(sl.slot) + (sl.wasUnavailable ? ' · 이탈' : ' · 연쇄 이동') }),
        h('div', { class: 'w' }, [
          (sl.fromPlayer || '—') + ' → ' + (sl.toPlayer || '—'),
          sl.fitDrop != null && sl.fitDrop !== 0
            ? h('span', { style: 'margin-left:7px;font-size:11.5px;color:' + (sl.fitDrop > 0 ? 'var(--danger)' : 'var(--acc)'),
                text: '적합도 ' + (sl.fitDrop > 0 ? '−' : '+') + Math.abs(sl.fitDrop) })
            : null
        ]),
        sl.roleChanged
          ? h('div', { class: 'a' }, ['역할도 바뀝니다: ', h('b', { style: 'color:var(--text)', text: sl.fromRole }),
              ' → ', h('b', { style: 'color:var(--text)', text: sl.toRole }),
              '. 대체 선수가 잘하는 것이 달라 역할을 맞췄습니다.'])
          : null,
        big
          ? h('div', { class: 'a', style: 'color:var(--warn)', text: '적합도가 크게 떨어집니다 — 이 자리를 덜 쓰는 포메이션으로 바꾸는 것도 방법입니다. 아래 「다른 포메이션 후보」를 보세요.' })
          : null
      ]));
    });
    if (im.instructions.length) {
      card.appendChild(h('div', { class: 'small', style: 'margin-top:8px;color:var(--dim)' }, [
        h('b', { style: 'color:var(--text)', text: '함께 바뀐 지시: ' }),
        im.instructions.map(function (i) { return i.ko + ' ' + i.from + '→' + i.to; }).join(' · ')
      ]));
    }
    return card;
  }

  function unavailableNote(list) {
    if (!list || !list.length) return null;
    return h('div', { class: 'card tight' }, [
      h('div', { class: 'small muted' }, [
        h('b', { style: 'color:var(--warn)', text: list.length + '명을 빼고 짰습니다 — ' }),
        list.map(function (u) { return u.name + '(' + u.reason + ')'; }).join(', '),
        '. 「스쿼드」 탭에서 상태를 되돌리면 다시 포함됩니다.'
      ])
    ]);
  }

  function warningsCard(warnings) {
    var wc = h('div', { class: 'card' }, [
      h('h2', { text: '점검할 점' }),
      h('div', { class: 'desc', text: '이 조합에서 실제로 문제가 되는 부분입니다.' })
    ]);
    warnings.forEach(function (w) {
      wc.appendChild(h('div', { class: 'warn' + (w.level === 'high' ? ' high' : '') }, [
        h('span', { class: 'ic', text: w.level === 'high' ? '!' : '·' }),
        // 무엇이 잘못됐는지만 알려 주면 화면 앞에서 다시 막힙니다.
        h('span', {}, [w.text, w.fix ? h('span', { class: 'fixnote', text: '→ ' + w.fix }) : null])
      ]));
    });
    return wc;
  }

  // ── 세트피스 ────────────────────────────────────────────────────────────
  function setPieceCard(xi) {
    var sp;
    try { sp = E.setPieces(xi); } catch (e) { return null; }
    if (!sp) return null;
    var anyPick = sp.attack.concat(sp.defence, sp.specialists)
      .some(function (s) { return s.picks.length; });
    if (!anyPick) return null;

    function slotRows(box, rows) {
      rows.forEach(function (s) {
        var val = s.picks.length
          ? s.picks.map(function (p) { return p.name; }).join(', ')
          : '조건을 넘는 선수가 없습니다';
        box.appendChild(h('details', { class: 'help' }, [
          h('summary', {}, [
            h('span', { style: 'font-weight:700', text: s.ko }),
            h('span', { class: 'tiny muted', text: '  ' + s.fm }),
            h('div', { style: 'font-size:12.5px;color:' + (s.picks.length ? 'var(--text)' : 'var(--dim2)'), text: val })
          ]),
          h('div', { class: 'body' }, [
            h('div', { class: 'tiny', style: 'color:var(--dim)', text: s.why }),
            s.picks.length ? h('div', { class: 'tiny muted', style: 'margin-top:4px',
              text: s.picks.map(function (p) { return p.name + ' · ' + p.pos + ' ' + p.role; }).join(' / ') }) : null,
            (!s.picks.length && s.need) ? h('div', { class: 'tiny muted', style: 'margin-top:4px',
              text: '최소 기준: ' + Object.keys(s.need).map(function (k) {
                return (RD.ATTRS[k] ? RD.ATTRS[k].ko : k) + ' ' + s.need[k];
              }).join(' · ') }) : null
          ])
        ]));
      });
      return box;
    }

    function line(cls, icon, text, fix) {
      return h('div', { class: cls }, [
        h('span', { class: 'ic', text: icon }),
        h('span', {}, [text, fix ? h('span', { class: 'fixnote', text: '→ ' + fix }) : null])
      ]);
    }

    function noteLine(n) {
      return line('warn' + (n.level === 'high' ? ' high' : ''),
        n.level === 'high' ? '!' : n.level === 'good' ? '★' : '·', n.text, n.fix);
    }

    /*
     * 루틴 하나를 접이식으로 냅니다.
     *
     * 코너 둘 + 프리킥 다섯이라 다 펼쳐 두면 카드가 화면 세 개 길이가 됩니다.
     * 접어 두되 요약 줄에 키커와 경고 개수를 넣어, 열지 않고도 무엇이 문제인지
     * 보이게 합니다.
     */
    function routineBox(r) {
      var lead = r.slots.filter(function (s) { return s.picks.length; })[0];
      var bad = r.notes.filter(function (n) { return n.level === 'high'; }).length;
      var box = rememberOpen('sp:' + r.id, h('details', { class: 'help', style: 'margin-top:9px' }));
      box.appendChild(h('summary', {}, [
        h('span', { style: 'font-weight:800', text: r.ko }),
        bad ? h('span', { class: 'tiny', style: 'color:var(--danger);font-weight:800', text: '  ! ' + bad }) : null,
        h('div', { class: 'tiny muted', text: r.when }),
        h('div', { style: 'font-size:12.5px', text: lead ? lead.ko + ' — ' + lead.picks.map(function (p) { return p.name; }).join(', ') : '배치할 선수가 없습니다' })
      ]));
      var body = h('div', { class: 'body' }, [
        h('div', { class: 'tiny muted', style: 'margin-bottom:6px', text: r.desc })
      ]);
      r.notes.forEach(function (n) { body.appendChild(noteLine(n)); });
      slotRows(body, r.slots);
      box.appendChild(body);
      return box;
    }

    function group(title, desc, rows) {
      var box = h('div', { style: 'margin-top:12px' }, [
        h('div', { style: 'font-size:12px;font-weight:800;margin-bottom:3px', text: title }),
        h('div', { class: 'tiny muted', style: 'margin-bottom:7px', text: desc })
      ]);
      return slotRows(box, rows);
    }

    var card = h('details', { class: 'card' });
    card.appendChild(h('summary', { style: 'cursor:pointer' }, [
      h('span', { style: 'font-size:15px;font-weight:800', text: '세트피스' }),
      sp.verdict ? h('span', { class: 'tiny muted', text: '  ' + (sp.verdict.level === 'good' ? '이 팀의 득점 경로'
        : sp.verdict.level === 'mid' ? '덤' : '기대하기 어려움') }) : null
    ]));
    card.appendChild(h('div', { class: 'desc', style: 'margin-top:8px',
      text: '선발 11명만 보고 정합니다. FM 전술 → 세트피스에서 같은 자리에 이 선수를 넣으면 됩니다(게임 언어가 달라도 찾을 수 있게 영문 표기를 같이 적었습니다).' }));

    if (sp.verdict) {
      card.appendChild(line(sp.verdict.level === 'good' ? 'warn high' : 'warn',
        sp.verdict.level === 'good' ? '★' : '·', sp.verdict.text, sp.verdict.fix));
    }
    sp.swing.forEach(function (s) { card.appendChild(line('warn', '·', s.text, s.fix)); });
    if (sp.weakDefence) card.appendChild(line('warn high', '!', sp.weakDefence.text, sp.weakDefence.fix));

    /*
     * 상황별 루틴 — 공격 넷, 수비 셋.
     *
     * FM의 세트피스 편집기가 상황마다 따로 짜게 되어 있으므로 화면도 그렇게
     * 나눕니다. 하나로 뭉쳐 두면 어느 배치를 어디에 넣어야 하는지 알 수 없습니다.
     */
    [['공격 상황', 'att'], ['수비 상황', 'def']].forEach(function (g) {
      var rs = (sp.routines || []).filter(function (r) { return r.side === g[1]; });
      if (!rs.length) return;
      card.appendChild(h('div', { style: 'font-size:12px;font-weight:800;margin:14px 0 2px', text: g[0] }));
      rs.forEach(function (r) { card.appendChild(routineBox(r)); });
    });

    card.appendChild(group('전담 키커',
      'FM의 「전담 키커」 화면에 넣는 값입니다(위 루틴은 그 사람이 찬 뒤 나머지 열 명이 어디 서는지입니다). 여기는 한 사람이 여러 개를 겸해도 됩니다.',
      sp.specialists));

    if (sp.known < 6) {
      card.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:9px',
        text: '능력치를 아는 선발이 ' + sp.known + '명뿐이라 일부 자리는 비워 뒀습니다 — 모르는 값으로 지정하면 엉뚱한 선수가 키커가 됩니다.' }));
    }
    return card;
  }

  function instructionsCard(instructions) {
    var ic = h('div', { class: 'card' }, [
      h('h2', { text: '팀 지시' }),
      h('div', { class: 'desc', text: '색이 들어온 항목만 기본값에서 바꾸면 됩니다. 각 줄을 누르면 왜 그렇게 정해졌는지 나옵니다.' })
    ]);
    ['core', 'ip', 'tr', 'ood'].forEach(function (g) {
      var items = [];
      Object.keys(instructions.axes).forEach(function (k) {
        var a = instructions.axes[k];
        if (a.group === g) items.push(axisRow(a));
      });
      Object.keys(instructions.toggles).forEach(function (k) {
        var t = instructions.toggles[k];
        if (t.group === g && (t.on || t.reasons.length)) items.push(toggleRow(t));
      });
      if (!items.length) return;
      ic.appendChild(h('h3', { style: 'font-size:12px;color:var(--dim);margin:13px 0 6px', text: TD.GROUP_KO[g] }));
      var box = h('div', { class: 'instr' });
      items.forEach(function (i) { box.appendChild(i); });
      ic.appendChild(box);
    });
    return ic;
  }

  function individualCard(individual) {
    var pc = h('div', { class: 'card' }, [
      h('h2', { text: '개인 지시' }),
      h('div', { class: 'desc', text: '선수 개인 능력치와 상대 특징에서 나온 항목만 적었습니다. 점선 표시는 역할이 자동으로 켜서 끌 수 없는 지시입니다.' })
    ]);
    if (!individual.length) {
      pc.appendChild(h('div', { class: 'small muted', text: '따로 손댈 개인 지시가 없습니다 — 역할 기본값 그대로 두세요.' }));
    }
    individual.forEach(function (p) {
      var ul = h('ul');
      p.items.forEach(function (it) {
        // 특성과 반대 방향인 지시는 지우지 않고 표시만 합니다 — 조용히 빼면
        // 왜 그 조언이 없는지 알 수 없고, 사용자가 직접 켜 버립니다.
        ul.appendChild(h('li', { class: it.locked ? 'lock' : (it.trait ? 'trait' : '') }, [
          h('b', { style: it.blockedBy ? 'color:var(--warn)' : '', text: it.text }),
          h('span', { class: 'r', text: it.why })
        ]));
      });
      pc.appendChild(h('div', { class: 'pi' }, [
        h('h4', {}, [
          (p.player ? p.player.name : posLabel(p.slot)),
          h('small', { text: p.role.ko + ' / ' + RD.DUTIES[p.duty].ko + ' · ' + posLabel(p.slot) })
        ]),
        ul
      ]));
    });
    // 특성이 이미 하고 있어서 뺀 지시는 이유를 남깁니다.
    if (individual.traitNotes && individual.traitNotes.length) {
      pc.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:10px' },
        individual.traitNotes.map(function (n) {
          return h('div', { style: 'margin-bottom:3px',
            text: (n.player ? n.player.name + ': ' : '') + n.text });
        })));
    }
    return pc;
  }

  /*
   * ── 전술 슬롯 ───────────────────────────────────────────────────────────
   *
   * FM에서는 포메이션을 매 경기 갈아엎을 수 없습니다. 선수들이 익히는 데 몇 주가
   * 걸리고(전술 친숙도), 바꾸는 순간 리셋됩니다. 그런데 이 도구는 상대가 바뀔
   * 때마다 포메이션을 새로 골랐습니다 — 상대 다섯 팀에 포메이션 네 종류가
   * 나왔습니다. 게임에서 따라 할 수 없는 조언이었습니다.
   *
   * 그래서 FM처럼 전술을 최대 세 개 저장해 두고, 경기마다 그중에서 고릅니다.
   */
  var MAX_TACTICS = E.MAX_SLOTS;   // 엔진과 한 군데서 셉니다 (FM도 세 개까지)

  function tacticSlotCard(res) {
    var card = h('div', { class: 'card' }, [
      h('h2', { text: '전술 슬롯' }),
      h('div', { class: 'desc' }, [
        'FM에서는 전술을 세 개까지 들고 다니고, ',
        h('b', { style: 'color:var(--text)', text: '포메이션을 매 경기 바꿀 수 없습니다' }),
        ' — 선수들이 익히는 데 몇 주가 걸리고 바꾸면 리셋됩니다. 여기에 저장해 두면 ',
        h('b', { style: 'color:var(--text)', text: '「맞춤 전술」이 저장된 것 중에서만 고릅니다' }),
        '(포메이션은 그대로 두고 역할·지시만 상대에 맞춥니다).'
      ])
    ]);

    var audit = null;
    try { audit = E.slotAudit(S.tactics || []); } catch (e) { audit = null; }
    var shapeById = {};
    if (audit) audit.slots.forEach(function (s) { shapeById[s.tactic.id] = s.shapeKo; });

    (S.tactics || []).forEach(function (t, i) {
      var f = FD.FORMATIONS.filter(function (x) { return x.id === t.formationId; })[0];
      /*
       * 친숙도는 파일로 알 수 없습니다 — FM 전술 화면의 막대를 보고 직접 넣습니다.
       * 미입력이 기본값이어야 합니다. 모르는 값을 '유동적'으로 가정하면 아직
       * 익지도 않은 전술을 자신 있게 추천하게 됩니다.
       */
      var famRow = h('div', { class: 'row', style: 'gap:6px;margin-top:6px;flex-wrap:wrap' }, [
        h('span', { class: 'tiny muted', style: 'align-self:center', text: '친숙도' })
      ]);
      [{ id: '', ko: '미입력' }].concat(TD.FAMILIARITY).forEach(function (lv) {
        famRow.appendChild(h('button', {
          class: 'chip', 'aria-pressed': (t.familiarity || '') === lv.id ? 'true' : 'false',
          title: lv.en ? lv.en + (lv.note ? ' — ' + lv.note : '') : 'FM 전술 화면의 친숙도 막대를 아직 안 봤을 때',
          onclick: function () {
            if (lv.id) t.familiarity = lv.id; else delete t.familiarity;
            save(); render();
          }
        }, [lv.ko]));
      });

      card.appendChild(h('div', { class: 'rep', style: 'margin-bottom:7px' }, [
        h('div', { class: 'row', style: 'gap:8px;align-items:center' }, [
          h('input', {
            type: 'text', value: t.name, style: 'flex:1 1 auto;min-width:0',
            'aria-label': '전술 이름',
            oninput: function (e) { t.name = e.target.value; save(); }
          }),
          h('button', {
            class: 'btn sm ghost',
            onclick: function () {
              if (!window.confirm('「' + t.name + '」 슬롯을 지웁니다. 계속할까요?')) return;
              S.tactics.splice(i, 1); save(); render();
            }
          }, ['지우기'])
        ]),
        h('div', { class: 'tiny muted', style: 'margin-top:5px',
          text: (f ? f.ko : t.formationId) + (t.planKo ? ' · ' + t.planKo : '')
            + (shapeById[t.id] ? '  ·  ' + shapeById[t.id] : '') }),
        famRow
      ]));
    });

    var cur = res.formation.id;
    var already = (S.tactics || []).some(function (t) { return t.formationId === cur; });
    var full = (S.tactics || []).length >= MAX_TACTICS;
    card.appendChild(h('div', { class: 'row', style: 'margin-top:8px' }, [
      h('button', {
        class: 'btn sm' + (already || full ? ' ghost' : ' pri'),
        onclick: function () {
          if (already) { toast('이미 같은 포메이션이 슬롯에 있습니다.'); return; }
          if (full) { toast('슬롯이 세 개 다 찼습니다 — FM도 세 개까지입니다.'); return; }
          S.tactics = (S.tactics || []).concat([{
            id: 't' + Date.now(),
            name: String.fromCharCode(65 + S.tactics.length) + ' · ' + res.plan.ko,
            formationId: cur, planId: res.plan.id, planKo: res.plan.ko
          }]);
          save(); render();
          toast('슬롯에 저장했습니다. 「맞춤 전술」이 이제 이 안에서 고릅니다.');
        }
      }, [already ? '이미 저장됨' : full ? '슬롯이 찼습니다' : '지금 전술을 슬롯에 저장']),
      (S.tactics || []).length
        ? h('span', { class: 'tiny muted', style: 'align-self:center',
          text: S.tactics.length + '/' + MAX_TACTICS + ' 사용 중' })
        : null
    ]));

    /*
     * 슬롯 구성 진단.
     *
     * 슬롯끼리 갈아타는 것 자체는 친숙도를 깎지 않습니다 — 깎이는 것은 포메이션을
     * 새로 만들 때입니다. 대신 슬롯을 늘리면 훈련이 쪼개집니다. 그래서 "몇 개를
     * 어떤 뼈대로 들고 다니는가"가 실제 문제이고, 여기서 그걸 말합니다.
     */
    if (audit && audit.findings.length) {
      card.appendChild(h('h3', { style: 'font-size:12px;color:var(--dim);margin:14px 0 6px', text: '슬롯 구성 점검' }));
      audit.findings.forEach(function (fd) {
        card.appendChild(h('div', {
          class: 'warn' + (fd.level === 'high' ? ' high' : ''),
          style: fd.level === 'good' ? 'border-color:#2c4a35' : ''
        }, [
          h('span', { class: 'ic', text: fd.level === 'high' ? '!' : fd.level === 'good' ? '✓' : '·' }),
          h('span', {}, [fd.text, fd.fix ? h('span', { class: 'fixnote', text: '→ ' + fd.fix }) : null])
        ]));
      });
      if (audit.split) {
        card.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:7px', text: audit.split }));
      }
    }
    return card;
  }

  /*
   * ── 뎁스와 로테이션 ─────────────────────────────────────────────────────
   *
   * 「주전 아니면 나머지」로는 로테이션을 말할 수 없습니다. 자리마다 대체 자원이
   * 주전과 얼마나 차이 나는지를 등급으로 내고, 컨디션을 알면 이번 경기에 누구를
   * 쉬게 할지까지 냅니다.
   *
   * 최적 11은 그대로 둡니다 — 여기서 나오는 것은 "그 11에서 무엇을 바꿀까"입니다.
   */
  var TIER_COLOR = {
    equal: 'var(--acc)', rotation: 'var(--acc2)',
    emergency: 'var(--warn)', none: 'var(--danger)'
  };

  function rotationCard(res) {
    var rot;
    try {
      rot = E.rotationPlan({ players: S.players, standing: S.standing || 'mid', base: res });
    } catch (e) { return null; }
    if (!rot) return null;
    var t = rot.tiers;

    var card = rememberOpen('rotation', h('details', { class: 'card' }));
    var head = rot.blocked ? '컨디션 미입력'
      : rot.applied.length ? rot.applied.length + '명 교체 제안'
        : '그대로 가세요';
    card.appendChild(h('summary', { style: 'cursor:pointer' }, [
      h('span', { style: 'font-size:15px;font-weight:800', text: '뎁스와 로테이션' }),
      h('span', { class: 'tiny muted', text: '  ' + head })
    ]));
    card.appendChild(h('div', { class: 'desc', style: 'margin-top:8px' }, [
      '자리마다 ', h('b', { style: 'color:var(--text)', text: '주전과 얼마나 차이 나는 대체 자원이 있는지' }),
      '를 냅니다. 다른 자리의 주전은 대체 자원으로 세지 않습니다 — 데려오면 원래 자리가 비니까요.'
    ]));

    // 1) 자리별 뎁스
    var counts = TD.DEPTH_TIERS.map(function (x) {
      return x.ko + ' ' + (t.counts[x.id] || 0);
    }).join(' · ');
    card.appendChild(h('div', { class: 'tiny muted', style: 'margin-bottom:7px', text: counts }));

    /*
     * statrow 격자는 좌우 두 팀 숫자를 견주려고 만든 것이라 이름이 두 줄로
     * 접힙니다. 여기는 한 줄에 자리 · 대체 자원 · 등급이 흐르면 되므로
     * 따로 짭니다 — 이름은 넘치면 말줄임으로 자릅니다.
     */
    var rows = h('div', {});
    t.slots.forEach(function (s) {
      var b = s.backup;
      rows.appendChild(h('div', {
        style: 'display:flex;gap:8px;align-items:baseline;padding:5px 0;'
          + 'border-bottom:1px solid var(--line);font-size:12.5px'
      }, [
        h('span', {
          style: 'flex:0 0 auto;min-width:96px;color:var(--dim2);white-space:nowrap;'
            + 'overflow:hidden;text-overflow:ellipsis;max-width:44%',
          text: s.posKo + (s.starter ? ' · ' + s.starter.name : '')
        }),
        h('span', {
          style: 'flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'
            + 'color:' + (b ? 'var(--text)' : 'var(--dim2)'),
          text: b ? '→ ' + b.name + ' (' + b.fit + (b.gap > 0 ? ' · −' + b.gap : '') + ')' : '→ 대체 자원 없음'
        }),
        h('span', {
          class: 'tiny', style: 'flex:0 0 auto;white-space:nowrap;font-weight:700;color:'
            + (TIER_COLOR[s.tier.id] || 'var(--dim)'),
          text: s.tier.ko
        })
      ]));
    });
    card.appendChild(rows);

    /*
     * 같은 사람이 여러 자리를 겹쳐 맡고 있으면 "대체 자원 7자리"가 사람 일곱 명으로
     * 읽힙니다. 실제로는 셋이 일곱 자리를 덮고 있을 수 있습니다.
     */
    if (t.overlap) {
      card.appendChild(h('div', { class: 'warn', style: 'margin-top:9px' }, [
        h('span', { class: 'ic', text: '·' }),
        h('span', {}, [t.overlap.text, h('span', { class: 'fixnote', text: t.overlap.fix })])
      ]));
    }

    // 2) 이번 경기 로테이션
    card.appendChild(h('h3', { style: 'font-size:12px;color:var(--dim);margin:15px 0 6px', text: '이번 경기 로테이션' }));
    if (rot.blocked) {
      card.appendChild(h('div', { class: 'warn' }, [
        h('span', { class: 'ic', text: '·' }),
        h('span', {}, [
          rot.blocked.text,
          h('span', { class: 'fixnote', text: rot.blocked.why }),
          h('span', { class: 'fixnote', text: '→ ' + rot.blocked.fix })
        ])
      ]));
      card.appendChild(h('div', { class: 'row', style: 'margin-top:8px' }, [
        h('button', {
          class: 'btn sm', onclick: function () { S.tab = 'squad'; S._open.bulkFit = true; render(); window.scrollTo(0, 0); }
        }, ['컨디션 넣으러 가기'])
      ]));
      return card;
    }

    if (!rot.swaps.length) {
      card.appendChild(h('div', { class: 'rep' }, [
        h('b', { text: '바꿀 이유가 없습니다. ' }),
        '선발 ' + rot.total + '명 중 컨디션을 아는 ' + rot.known + '명이 모두 쓸 만한 상태입니다.'
      ]));
      return card;
    }

    rot.swaps.forEach(function (s) {
      if (s.kind === 'hold') {
        card.appendChild(h('div', { class: 'warn high' }, [
          h('span', { class: 'ic', text: '!' }),
          h('span', {}, [s.text, h('span', { class: 'fixnote', text: s.why }),
            h('span', { class: 'fixnote', text: '→ ' + s.fix })])
        ]));
        return;
      }
      card.appendChild(h('div', { class: 'rep', style: 'margin-bottom:7px' }, [
        h('div', { class: 'row', style: 'gap:7px;align-items:center' }, [
          h('b', { style: 'color:var(--acc)', text: s.text }),
          h('span', {
            class: 'tiny', style: 'color:' + (s.cost <= 4 ? 'var(--acc)' : 'var(--warn)'),
            text: s.cost <= 0 ? '손실 없음' : '−' + s.cost + '점'
          })
        ]),
        h('div', { class: 'tiny', style: 'color:var(--dim);margin-top:4px', text: s.why }),
        h('div', { class: 'fixnote', text: '→ ' + s.fix }),
        s.sharpNote ? h('div', { class: 'fixnote', text: s.sharpNote }) : null
      ]));
    });

    if (rot.applied.length) {
      card.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:7px',
        text: '다 적용하면 선발 적합도 합계가 ' + rot.cost + '점 내려갑니다.' }));
      card.appendChild(bigPitch(rot.xi.lineup));
    }
    return card;
  }

  // 기본 전술 텍스트로 복사 — 맞춤 전술과 형식을 맞춥니다.
  function copyBase(res) {
    var L = [];
    L.push('■ FM24 시즌 기본 전술 — ' + res.formation.ko + ' / ' + res.plan.ko);
    L.push('FM 전술 유형: ' + ((TD.FM_PRESETS[res.plan.id] || {}).ko || TD.FM_PRESET_BLANK));
    L.push('');
    L.push('[선발과 역할]');
    res.xi.lineup.forEach(function (l, i) {
      var back = res.bench[i];
      L.push('  ' + posLabel(l.slot).padEnd(6) + ' ' + l.role.ko + ' / ' + RD.DUTIES[l.duty].ko +
        '  —  ' + (l.player ? l.player.name : '(미배정)') + (l.fit != null ? ' (' + l.fit + ')' : '') +
        (back && back.player ? '   교체: ' + back.player.name + ' (' + back.fit + ')' : ''));
    });
    L.push('');
    L.push('[팀 지시]');
    ['core', 'ip', 'tr', 'ood'].forEach(function (g) {
      var rows = [];
      Object.keys(res.instructions.axes).forEach(function (k) {
        var a = res.instructions.axes[k];
        if (a.group === g && a.shifted) rows.push('  ' + a.ko + ': ' + a.label);
      });
      Object.keys(res.instructions.toggles).forEach(function (k) {
        var t = res.instructions.toggles[k];
        if (t.group === g && t.on) rows.push('  ' + t.ko + ': 켜기');
      });
      if (rows.length) { L.push(' <' + TD.GROUP_KO[g] + '>'); rows.forEach(function (r) { L.push(r); }); }
    });
    if (res.individual.length) {
      L.push('');
      L.push('[개인 지시]');
      res.individual.forEach(function (p) {
        L.push('  ' + (p.player ? p.player.name : posLabel(p.slot)) + ' (' + p.role.ko + '/' + RD.DUTIES[p.duty].ko + ')');
        p.items.forEach(function (it) { L.push('    - ' + it.text + (it.locked ? ' (역할 고정)' : '')); });
      });
    }
    if (res.warnings.length) {
      L.push('');
      L.push('[점검할 점]');
      res.warnings.forEach(function (w) {
        L.push('  ! ' + w.text);
        if (w.fix) L.push('      → ' + w.fix);
      });
    }
    appendSetPieces(L, res.xi);
    writeClipboard(L.join('\n'));
  }

  // 복사한 글에도 세트피스를 넣습니다 — FM 화면 옆에 붙여 놓고 그대로 따라
  // 치는 용도라, 화면에만 있으면 정작 쓸 때 없습니다.
  function appendSetPieces(L, xi) {
    var sp;
    try { sp = E.setPieces(xi); } catch (e) { return; }
    if (!sp) return;
    var rows = (sp.routines || []).map(function (r) { return [r.ko, r.slots, r.notes]; })
      .concat([['전담 키커', sp.specialists, []]]);
    if (!rows.some(function (r) { return r[1].some(function (x) { return x.picks.length; }); })) return;
    L.push('');
    L.push('[세트피스]');
    if (sp.verdict) L.push('  ' + sp.verdict.text);
    sp.swing.forEach(function (x) { L.push('  ' + x.text); });
    if (sp.weakDefence) L.push('  ! ' + sp.weakDefence.text);
    rows.forEach(function (r) {
      L.push('  · ' + r[0]);
      (r[2] || []).forEach(function (n) { L.push('      ※ ' + n.text + (n.fix ? ' → ' + n.fix : '')); });
      r[1].forEach(function (x) {
        L.push('      ' + x.ko + ' (' + x.fm + '): '
          + (x.picks.length ? x.picks.map(function (p) { return p.name; }).join(', ') : '조건을 넘는 선수 없음'));
      });
    });
  }

  // ── 경기 중 탭 ──────────────────────────────────────────────────────────
  RENDER.match = function (root) {
    var M = S.match;
    // 예전 판에서 저장한 상태에는 없는 값입니다
    if (!M.oppLevel) M.oppLevel = 'even';

    // 1) 상황
    var flagChips = h('div', { class: 'chips' });
    TD.MATCH_FLAGS.forEach(function (f) {
      flagChips.appendChild(h('button', {
        class: 'chip', 'aria-pressed': M.flags.indexOf(f.id) >= 0 ? 'true' : 'false',
        onclick: function () {
          var i = M.flags.indexOf(f.id);
          if (i >= 0) M.flags.splice(i, 1); else M.flags.push(f.id);
          save(); render();
        }
      }, [f.ko]));
    });

    root.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: '지금 상황' }),
      h('div', { class: 'desc', text: '시간대와 점수만 넣어도 조정안이 나옵니다. 전반 기록까지 넣으면 훨씬 구체적으로 갈립니다.' }),
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '시간대' }),
        (function () {
          var seg = h('div', { class: 'seg', style: 'flex-wrap:wrap' });
          TD.MATCH_PHASES.forEach(function (p) {
            seg.appendChild(h('button', {
              'aria-pressed': M.phase === p.id ? 'true' : 'false',
              style: 'flex:1 0 33%',
              onclick: function () { M.phase = p.id; save(); render(); }
            }, [p.ko]));
          });
          return seg;
        })()
      ]),
      h('div', { class: 'grid2' }, [
        h('div', { class: 'field' }, [
          h('label', { class: 'f', text: '우리 득점' }),
          h('input', {
            type: 'number', min: '0', max: '20', inputmode: 'numeric', value: String(M.gf),
            oninput: function (e) { M.gf = Math.max(0, parseInt(e.target.value, 10) || 0); save(); refreshAdvice(); }
          })
        ]),
        h('div', { class: 'field' }, [
          h('label', { class: 'f', text: '상대 득점' }),
          h('input', {
            type: 'number', min: '0', max: '20', inputmode: 'numeric', value: String(M.ga),
            oninput: function (e) { M.ga = Math.max(0, parseInt(e.target.value, 10) || 0); save(); refreshAdvice(); }
          })
        ])
      ]),
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '상대 전력' }),
        (function () {
          var seg = h('div', { class: 'seg' });
          TD.OPP_LEVELS.forEach(function (l) {
            seg.appendChild(h('button', {
              'aria-pressed': M.oppLevel === l.id ? 'true' : 'false',
              onclick: function () { M.oppLevel = l.id; save(); render(); }
            }, [l.ko]));
          });
          return seg;
        })(),
        h('div', { class: 'tiny muted', style: 'margin-top:5px',
          text: '같은 1:1이라도 강팀 원정에서는 지켜야 할 승점 1이고, 약체 상대로는 잃고 있는 승점 2입니다.' })
      ]),
      h('label', { class: 'f', text: '해당하는 상황' }),
      flagChips
    ]));

    // 2) 전반 기록
    var mta;
    var statCard = h('div', { class: 'card dropzone' }, [
      h('h2', { text: '전반 기록 (선택)' }),
      h('div', { class: 'desc', text: 'FM 경기 통계 화면을 내보내 넣으세요. 슈팅·유효 슈팅·기대 득점·점유율·패스 성공률이 있으면 "무엇이 문제인지"까지 나옵니다.' }),
      h('div', { class: 'row', style: 'margin-bottom:9px' }, [
        filePicker('파일 선택', function (fl) { readFiles(fl, function (items) { readStats(items[0] && items[0].text); }); }),
        h('button', { class: 'btn', onclick: function () { readStats(mta.value); } }, ['붙여넣은 내용 읽기']),
        M.stats ? h('button', { class: 'btn ghost sm', onclick: function () { M.stats = null; save(); render(); } }, ['기록 지우기']) : null
      ]),
      (mta = h('textarea', { placeholder: '경기 통계 화면 내보내기 내용', 'aria-label': '경기 기록 붙여넣기' })),
      statsReportBox()
    ]);
    makeDropTarget(statCard, function (fl) { readFiles(fl, function (items) { readStats(items[0] && items[0].text); }); });
    root.appendChild(statCard);

    function readStats(text) {
      if (!text || !text.trim()) { toast('읽을 내용이 비어 있습니다.'); return; }
      var res = IMP.parseMatchStats(text);
      /*
       * 새 기록을 읽으면 좌우 선택을 다시 받아야 합니다. 지난 경기에서 「왼쪽」을
       * 골랐다고 이번 파일도 왼쪽이 우리 팀이라는 보장이 없는데, 그대로 두면
       * 저장 전 확인이 지나가 버려 상대 기록이 우리 것으로 쌓입니다.
       */
      M.sideChosen = false;
      if (res.error || !res.rows.length) {
        M.stats = { error: res.error || '표를 찾지 못했습니다.', format: res.format };
      } else {
        M.stats = { rows: res.rows, left: res.left, right: res.right, unknown: res.unknown };
      }
      save(); render();
    }

    function statsReportBox() {
      if (!M.stats) return h('div');
      if (M.stats.error) {
        return h('div', { class: 'rep err' }, [
          h('div', {}, [h('b', { text: '읽지 못했습니다. ' }), M.stats.error]),
          h('div', { class: 'tiny muted', style: 'margin-top:6px',
            text: 'FM 경기 화면에서 통계 표가 보이는 상태로 내보냈는지 확인하세요. 표가 아니라 그림으로 보이는 화면은 빈 파일이 나옵니다.' })
        ]);
      }
      var box = h('div', { class: 'rep' });
      box.appendChild(h('div', { class: 'small', style: 'margin-bottom:7px' }, [
        h('b', { text: '어느 쪽이 우리 팀인가요?' }),
        ' 파일에는 팀 이름이 없어 알 수 없습니다 — 잘못 고르면 조언이 통째로 반대가 됩니다.'
      ]));
      var seg = h('div', { class: 'seg', style: 'margin-bottom:9px' });
      [['left', '왼쪽'], ['right', '오른쪽']].forEach(function (o) {
        var v = M.stats[o[0]] || {};
        seg.appendChild(h('button', {
          'aria-pressed': M.side === o[0] ? 'true' : 'false',
          onclick: function () { M.side = o[0]; M.sideChosen = true; save(); render(); }
        }, [o[1] + ' (슈팅 ' + fmtStat(v.shots) + ' · 점유 ' + fmtStat(v.possession) + '%)']));
      });
      box.appendChild(seg);
      var tbl = h('div', { class: 'statrows' });
      M.stats.rows.forEach(function (r) {
        var ours = M.side === 'left' ? r.left : r.right;
        var theirs = M.side === 'left' ? r.right : r.left;
        tbl.appendChild(h('div', { class: 'statrow' }, [
          h('b', { class: 'us', text: fmtStat(ours) }),
          h('span', { class: 'lb', text: r.label }),
          h('span', { class: 'them', text: fmtStat(theirs) })
        ]));
      });
      box.appendChild(tbl);
      if (M.stats.unknown && M.stats.unknown.length) {
        box.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:7px',
          text: '읽지 못한 항목: ' + M.stats.unknown.slice(0, 8).join(', ') }));
      }
      return box;
    }

    // 3) 조정안
    var advice;
    try {
      advice = E.inMatchAdvice({
        phase: M.phase, goalsFor: M.gf, goalsAgainst: M.ga,
        oppLevel: M.oppLevel, flags: M.flags,
        stats: M.stats && !M.stats.error
          ? { us: M.stats[M.side], them: M.stats[M.side === 'left' ? 'right' : 'left'] }
          : null
      });
    } catch (err) {
      root.appendChild(h('div', { class: 'card' }, [h('div', { class: 'rep err', text: '오류: ' + (err && err.message) })]));
      return;
    }

    var head = h('div', { class: 'card' }, [
      h('h2', {}, [
        advice.phase.ko + ' · ',
        h('span', { style: 'color:' + (advice.score.diff > 0 ? 'var(--acc)' : advice.score.diff < 0 ? 'var(--danger)' : 'var(--dim)'),
          text: advice.score.gf + ' : ' + advice.score.ga }),
        h('span', { class: 'tiny muted', text: '  · 상대 ' + oppLevelKo(advice.oppLevel) }),
        advice.hasStats ? h('span', { class: 'tiny muted', text: '  · 전반 기록 반영' }) : null
      ]),
      h('div', { class: 'desc', text: advice.fired.length
        ? '위에서부터 순서대로 하면 됩니다. 「그대로 두세요」가 있으면 그게 가장 중요한 조언입니다.'
        : '지금 상황에서 특별히 손댈 것이 없습니다 — 하던 대로 두세요.' })
    ]);
    root.appendChild(head);

    advice.fired.forEach(function (f) {
      var isHold = f.items.some(function (i) { return i.kind === 'hold'; });
      var card = h('div', {
        class: 'card',
        style: f.tier === 'key'
          ? ('border-color:' + (isHold ? '#2c4a35' : '#4a3c17') + ';background:' + (isHold ? 'rgba(74,222,128,.055)' : 'rgba(251,191,36,.05)'))
          : ''
      }, [
        h('div', { class: 'row', style: 'gap:7px;align-items:baseline;margin-bottom:5px' }, [
          h('span', { style: 'font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--dim2)', text: f.group }),
          h('span', { style: 'font-size:13.5px;font-weight:700', text: f.why })
        ])
      ]);
      var ul = h('ul', { style: 'margin:0;padding-left:0;list-style:none' });
      f.items.forEach(function (i) {
        ul.appendChild(h('li', { style: 'margin-bottom:7px;font-size:12.5px' }, [
          h('b', {
            style: 'display:inline-block;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:11px;'
              + (i.kind === 'hold' ? 'background:rgba(74,222,128,.15);color:var(--acc)'
                : 'background:var(--panel3);border:1px solid var(--line2);color:var(--dim)'),
            text: KIND_KO[i.kind] || i.kind
          }),
          i.text,
          i.why ? h('span', { style: 'display:block;color:var(--dim2);font-size:11.5px;margin-top:2px', text: i.why }) : null
        ]));
      });
      card.appendChild(ul);
      root.appendChild(card);
    });

    if (advice.fired.length) {
      root.appendChild(h('div', { class: 'card tight' }, [
        h('div', { class: 'row' }, [
          h('button', { class: 'btn', onclick: function () { copyAdvice(advice); } }, ['조정안 복사'])
        ])
      ]));
    }

    // 4) 참고 — 상황별 기본 지침
    var ref = h('div', { class: 'card' }, [
      h('h2', { text: '상황별 기본 지침' }),
      h('div', { class: 'desc', text: '위 조정안과 별개로, 상황마다 무엇을 어떤 순서로 건드릴지 정리해 둔 것입니다.' })
    ]);
    TD.SCENARIOS.forEach(function (sc) {
      var ol = h('ol');
      sc.steps.forEach(function (s) { ol.appendChild(h('li', { text: s })); });
      ref.appendChild(h('details', { class: 'help' }, [
        h('summary', { text: sc.ko }),
        h('div', { class: 'body' }, [
          h('div', { class: 'tiny muted', style: 'margin-bottom:4px', text: sc.when }),
          ol
        ])
      ]));
    });
    root.appendChild(ref);
    root.appendChild(saveMatchCard());

    function refreshAdvice() { render(); }
  };

  /*
   * ── 경기 저장 ───────────────────────────────────────────────────────────
   *
   * 「경기 중」 탭에 이미 점수와 기록이 다 들어 있습니다. 한 번 더 치게 하지 말고
   * 여기서 그대로 저장합니다. 숫자로 알 수 없는 것(실점 장면이 세트피스였는지
   * 역습이었는지)만 태그로 받습니다 — 그게 반복되면 전술보다 먼저 고칠 문제입니다.
   */
  function saveMatchCard() {
    var M = S.match;
    if (!S._newMatch) S._newMatch = { opp: '', venue: 'home', flags: [] };
    var NM = S._newMatch;

    var card = rememberOpen('saveMatch', h('details', { class: 'card' }));
    card.appendChild(h('summary', { style: 'cursor:pointer' }, [
      h('span', { style: 'font-size:15px;font-weight:800', text: '이 경기 기록으로 저장' }),
      h('span', { class: 'tiny muted', text: '  ' + (S.matches || []).length + '경기 저장됨' })
    ]));
    card.appendChild(h('div', { class: 'desc', style: 'margin-top:8px' }, [
      '한 경기만으로는 운과 실력을 가를 수 없습니다. ',
      h('b', { style: 'color:var(--text)', text: '기대 득점 2.4에 무득점으로 진 경기는 그 자체로는 아무것도 말해 주지 않습니다' }),
      ' — 몇 경기가 쌓여야 「경기 후」 탭이 마무리가 진짜 문제인지 판정합니다. 위에 넣은 점수와 기록을 그대로 저장합니다.'
    ]));

    card.appendChild(h('div', { class: 'grid2' }, [
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '상대 (선택)' }),
        h('input', {
          type: 'text', value: NM.opp, placeholder: '웨스트햄',
          oninput: function (e) { NM.opp = e.target.value; }
        })
      ]),
      h('div', { class: 'field' }, [
        h('label', { class: 'f', text: '장소' }),
        segment([['home', '홈'], ['away', '원정']], NM.venue, function (v) { NM.venue = v; render(); })
      ])
    ]));

    var chips = h('div', { class: 'chips', style: 'margin-top:6px' });
    TD.MATCH_TAGS.forEach(function (t) {
      chips.appendChild(h('button', {
        class: 'chip', 'aria-pressed': NM.flags.indexOf(t.id) >= 0 ? 'true' : 'false',
        title: t.repeat,
        onclick: function () {
          var i = NM.flags.indexOf(t.id);
          if (i >= 0) NM.flags.splice(i, 1); else NM.flags.push(t.id);
          render();
        }
      }, [t.ko]));
    });
    card.appendChild(h('label', { class: 'f', style: 'margin-top:9px;display:block', text: '이 경기에 있었던 일 (선택)' }));
    card.appendChild(chips);

    var hasStats = !!(M.stats && !M.stats.error);
    card.appendChild(h('div', { class: 'tiny muted', style: 'margin-top:9px',
      text: hasStats
        ? '점수 ' + M.gf + ':' + M.ga + ' · 위에 넣은 기록을 함께 저장합니다.'
        : '점수 ' + M.gf + ':' + M.ga + ' · 기록이 없어 점수만 저장합니다 — 기대 득점이 없으면 마무리를 판정할 수 없습니다.' }));

    card.appendChild(h('div', { class: 'row', style: 'margin-top:9px' }, [
      h('button', {
        class: 'btn pri',
        onclick: function () {
          /*
           * 같은 경기를 두 번 저장하는 사고를 막습니다.
           *
           * 저장해도 「경기 중」 탭의 점수와 기록은 그대로 남습니다(다음 경기를
           * 넣기 전까지는 그게 맞습니다). 그래서 버튼을 한 번 더 누르면 같은
           * 경기가 통계에 두 번 들어가고, 그 순간 누적 판정이 통째로 틀어집니다.
           */
          // 상대 이름까지 넣습니다. 기록 없이 1:0 두 번을 저장하는 것은 정상인데,
          // 점수만 보면 매번 "같은 경기 아니냐"고 묻게 됩니다.
          var sig = NM.opp.trim() + '|' + M.gf + ':' + M.ga + '|'
            + (hasStats ? JSON.stringify(M.stats[M.side]) : '');
          var dup = (S.matches || []).some(function (g) {
            return g && g._sig === sig;
          });
          if (dup && !window.confirm('같은 점수와 기록의 경기가 이미 저장돼 있습니다. 또 저장할까요?')) return;
          /*
           * 어느 쪽이 우리 팀인지 안 고르고 저장하면 상대 기록이 우리 것으로
           * 쌓입니다. 되돌릴 방법이 없으므로 저장 전에 한 번 확인합니다.
           */
          if (hasStats && !M.sideChosen
            && !window.confirm('「어느 쪽이 우리 팀인가요?」를 아직 안 고르셨습니다. 지금은 '
              + (M.side === 'left' ? '왼쪽' : '오른쪽') + '이 우리 팀으로 저장됩니다. 계속할까요?')) return;

          var us = hasStats ? M.stats[M.side] : null;
          var them = hasStats ? M.stats[M.side === 'left' ? 'right' : 'left'] : null;
          S.matches = (S.matches || []).concat([{
            id: 'g' + Date.now(), _sig: sig,
            opp: NM.opp.trim(), venue: NM.venue,
            gf: M.gf, ga: M.ga, oppLevel: M.oppLevel,
            flags: NM.flags.slice(),
            us: us || null, them: them || null
          }]);
          // 다음 경기를 위해 비웁니다 — 지난 경기 태그가 남으면 통계가 오염됩니다.
          // 장소는 그대로 둡니다. 다음이 원정일 거라고 도구가 알 수 없습니다.
          S._newMatch = { opp: '', venue: NM.venue, flags: [] };
          save();
          S.tab = 'review'; render(); window.scrollTo(0, 0);
          toast('저장했습니다. 「경기 후」 탭에서 누적으로 봅니다.');
        }
      }, ['저장하고 경기 후로 이동'])
    ]));
    return card;
  }

  /*
   * ── 경기 후 탭 ──────────────────────────────────────────────────────────
   *
   * 「경기 중」이 한 경기 안에서 무엇을 건드릴지를 말한다면, 여기는 여러 경기를
   * 겹쳐 놓고 "그게 반복되는 문제인가"를 봅니다. 둘은 답이 다릅니다 — 한 경기의
   * 결정력 부족은 운이고, 여섯 경기의 결정력 부족은 스쿼드입니다.
   */
  RENDER.review = function (root) {
    /*
     * 지금 선발을 같이 넘기면 판정이 이름까지 말합니다 — "마무리가 문제다"에서
     * "지금 최전방이 누구고 그 값이 얼마다"까지. 선수가 없으면 안 넘깁니다.
     */
    var xiNow = null;
    if (S.players.length >= 7) {
      try {
        var sigNow = baseSignature();
        var cached = (S._baseCache && S._baseCache.sig === sigNow) ? S._baseCache.res : null;
        if (!cached) {
          cached = E.baseTactic({ players: S.players, standing: S.standing || 'mid' });
          if (cached) S._baseCache = { sig: sigNow, res: cached };
        }
        xiNow = cached ? cached.xi : null;
      } catch (e) { xiNow = null; }
    }

    var rv = null;
    try { rv = E.matchReview(S.matches || [], xiNow); } catch (e) {
      root.appendChild(h('div', { class: 'card' }, [h('div', { class: 'rep err', text: '오류: ' + (e && e.message) })]));
      return;
    }

    if (!rv) {
      root.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'empty' }, [
          h('b', { text: '저장한 경기가 없습니다' }),
          '「경기 중」 탭에서 점수와 기록을 넣고 맨 아래 「이 경기 기록으로 저장」을 누르면 여기에 쌓입니다. '

                  if (d.standing) S.standing = d.standing;
                  if (d.pinnedFormation !== undefined) S.pinnedFormation = d.pinnedFormation;
                  if (d.tactics) S.tactics = d.tactics;
                  if (Array.isArray(d.matches)) S.matches = d.matches;
                  if (d.opponentSquad) S.opponentSquad = d.opponentSquad;
                  if (d.match) Object.assign(S.match, d.match);
                  S._baseCache = null; S._needsCache = null; S._trainCache = null;
                  save(); render(); toast('불러왔습니다.');
                } catch (e) { toast('파일을 읽지 못했습니다.'); }
              };
              fr.readAsText(f, 'utf-8');
              ev.target.value = '';
            }
          });
          return h('span', {}, [input, h('button', { class: 'btn sm ghost', onclick: function () { input.click(); } }, ['불러오기'])]);
        })()
      ])
    ]));
  };

  /*
   * ── 다른 기기로 옮기기 ──────────────────────────────────────────────────
   *
   * 데이터는 이 기기의 브라우저 안에만 있습니다(그래서 어디로도 전송되지
   * 않습니다). 대신 집과 회사를 오가려면 옮길 방법이 필요합니다.
   *
   * 서버를 두면 자동 동기화가 되지만, 그러면 스쿼드가 남의 서버에 올라갑니다.
   * 그래서 서버 없이 옮기는 두 가지를 둡니다 — 링크/코드와 파일.
   *
   * 스쿼드 24명이 JSON으로 12KB인데 압축하면 2.5KB, base64로 3.4천 자입니다.
   * 주소창에 들어가는 크기라 링크 하나로 통째로 옮길 수 있습니다.
   */
  function syncPayload() {
    // 화면에서 손으로 정한 것 전부. '_'로 시작하는 내부 캐시는 뺍니다.
    var players = S.players.map(function (p) {
      var q = {};
      Object.keys(p).forEach(function (k) { if (k.charAt(0) !== '_') q[k] = p[k]; });
      return q;
    });
    return {
      v: 2, players: players, opponent: S.opponent, context: S.context,
      standing: S.standing, pinnedFormation: S.pinnedFormation,
      opponentSquad: S.opponentSquad, match: S.match, tactics: S.tactics, matches: S.matches
    };
  }

  function applyPayload(d) {
    if (!d || typeof d !== 'object') throw new Error('내용을 알아볼 수 없습니다.');
    if (d.players) S.players = d.players;
    if (d.opponent) Object.assign(S.opponent, d.opponent);
    if (d.context) Object.assign(S.context, d.context);
    if (d.standing) S.standing = d.standing;
    if (d.pinnedFormation !== undefined) S.pinnedFormation = d.pinnedFormation;
    if (d.tactics) S.tactics = d.tactics;
    if (Array.isArray(d.matches)) S.matches = d.matches;
    if (d.opponentSquad) S.opponentSquad = d.opponentSquad;
    if (d.match) Object.assign(S.match, d.match);
    S._baseCache = null; S._needsCache = null; S._trainCache = null;
    save(); render();
  }

  // base64url — 주소에 그대로 실을 수 있게 +/= 를 씁니다.
  function b64urlEncode(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function b64urlDecode(str) {
    var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function squeeze(text) {
    var bytes = new TextEncoder().encode(text);
    // CompressionStream이 없는 브라우저에서는 압축 없이 보냅니다 —
    // 링크가 길어질 뿐 동작은 같습니다.
    if (typeof CompressionStream !== 'function') return { z: 0, bytes: bytes };
    var cs = new CompressionStream('deflate-raw');
    var w = cs.writable.getWriter();
    w.write(bytes); w.close();
    var buf = await new Response(cs.readable).arrayBuffer();
    return { z: 1, bytes: new Uint8Array(buf) };
  }
  async function unsqueeze(z, bytes) {
    if (!z) return new TextDecoder().decode(bytes);
    var ds = new DecompressionStream('deflate-raw');
    var w = ds.writable.getWriter();
    w.write(bytes); w.close();
    var buf = await new Response(ds.readable).arrayBuffer();
    return new TextDecoder().decode(buf);
  }

  // 코드 모양: FM24.<압축여부>.<base64url>
  async function makeCode() {
    var r = await squeeze(JSON.stringify(syncPayload()));
    return 'FM24.' + r.z + '.' + b64urlEncode(r.bytes);
  }
  async function readCode(code) {
    var m = String(code || '').trim().match(/FM24\.([01])\.([A-Za-z0-9\-_]+)/);
    if (!m) throw new Error('FM24로 시작하는 코드가 아닙니다.');
    var text = await unsqueeze(m[1] === '1', b64urlDecode(m[2]));
    return JSON.parse(text);
  }

  /*
   * 백업에는 화면에서 손으로 정한 것이 전부 들어가야 합니다.
   * 예전에는 players/opponent/context만 담아서, 리그 내 위치와 고정한 포메이션이
   * 조용히 빠졌습니다 — 브라우저 데이터를 지우면 그 설정만 복구가 안 됐습니다.
   */
  function exportJson() {
    var blob = new Blob([JSON.stringify({
      version: 2,
      players: S.players, opponent: S.opponent, context: S.context,
      standing: S.standing, pinnedFormation: S.pinnedFormation,
      opponentSquad: S.opponentSquad, match: S.match,
      tactics: S.tactics, matches: S.matches
    }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'fm24-tactics.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ── 전술 텍스트 복사 ────────────────────────────────────────────────────
  function copyPlan(res, pick) {
    var L = [];
    L.push('■ FM24 전술 — ' + res.xi.formation.ko + ' / ' + res.plans.top.map(function (p) { return p.ko; }).join(' + '));
    L.push('상대: ' + (res.opponentFormation ? res.opponentFormation.ko : '모름'));
    // 어느 슬롯을 꺼내는지가 빠지면 붙여넣은 사람이 새로 만들어야 하는 줄 압니다.
    if (pick) {
      L.push('전술 슬롯: ' + pick.best.tactic.name
        + (pick.best.fam ? ' (친숙도 ' + pick.best.fam.ko + ')' : ''));
      if (pick.trainNote) L.push('※ ' + pick.trainNote);
    }
    L.push('');
    L.push('[선발과 역할]');
    res.xi.lineup.forEach(function (l) {
      L.push('  ' + posLabel(l.slot).padEnd(6) + ' ' + l.role.ko + ' / ' + RD.DUTIES[l.duty].ko +
        '  —  ' + (l.player ? l.player.name : '(미배정)') + (l.fit != null ? ' (' + l.fit + ')' : ''));
    });
    L.push('');
    L.push('[팀 지시]');
    ['core', 'ip', 'tr', 'ood'].forEach(function (g) {
      var rows = [];
      Object.keys(res.instructions.axes).forEach(function (k) {
        var a = res.instructions.axes[k];
        if (a.group === g && a.shifted) rows.push('  ' + a.ko + ': ' + a.label);
      });
      Object.keys(res.instructions.toggles).forEach(function (k) {
        var t = res.instructions.toggles[k];
        if (t.group === g && t.on) rows.push('  ' + t.ko + ': 켜기');
      });
      if (rows.length) { L.push(' <' + TD.GROUP_KO[g] + '>'); rows.forEach(function (r) { L.push(r); }); }
    });
    if (res.individual.length) {
      L.push('');
      L.push('[개인 지시]');
      res.individual.forEach(function (p) {
        L.push('  ' + (p.player ? p.player.name : posLabel(p.slot)) + ' (' + p.role.ko + '/' + RD.DUTIES[p.duty].ko + ')');
        p.items.forEach(function (it) { L.push('    - ' + it.text + (it.locked ? ' (역할 고정)' : '')); });
      });
    }
    var brief = res.brief.key.concat(res.brief.normal);
    if (brief.length) {
      L.push('');
      L.push('[상대 대응]');
      brief.forEach(function (b) { L.push('  · ' + b.why + (b.action ? '\n      → ' + b.action : '')); });
    }
    if (res.warnings.length) {
      L.push('');
      L.push('[점검할 점]');
      res.warnings.forEach(function (w) {
        L.push('  ! ' + w.text);
        if (w.fix) L.push('      → ' + w.fix);
      });
    }
    appendSetPieces(L, res.xi);
    writeClipboard(L.join('\n'));
  }


  function writeClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('전술을 복사했습니다.'); },
        function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('전술을 복사했습니다.'); }
    catch (e) { toast('복사하지 못했습니다.'); }
    document.body.removeChild(ta);
  }

  // 새 버전이 준비되면 곧바로 넘겨받습니다. 예전에는 캐시 우선이라 한 번 연
  // 사람에게 계속 옛 버전이 나갔고, 고친 내용이 전달되지 않았습니다.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {

      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {

            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              toast('새 버전이 준비됐습니다. 새로고침하세요.');
            }
          });

      }).catch(function () { /* 오프라인 캐시는 없어도 동작합니다 */ });

  /*

   *
   * 조용히 덮어쓰지 않습니다 — 이 기기에 이미 넣어 둔 스쿼드가 있으면

   * (새로고침할 때마다 다시 묻지 않도록).
   */
  (function () {
    var m = location.hash.match(/#d=([01]\.[A-Za-z0-9\-_]+)/);
    if (!m) return;
    var code = 'FM24.' + m[1];
    history.replaceState(null, '', location.pathname + location.search);
    readCode(code).then(function (d) {
      var n = (d.players || []).length;
      if (S.players.length && !window.confirm(
        '링크에 선수 ' + n + '명이 들어 있습니다.\n'

        toast('불러오지 않았습니다.');
        return;
      }
      applyPayload(d);
      toast(n + '명을 불러왔습니다.');
    }).catch(function (e) { toast('링크를 읽지 못했습니다: ' + e.message); });
  })();

  // 겹쳐 보기는 실행 방식으로 결정되는 값이라 저장하지 않고 주소에서만 읽습니다.
  // (?overlay=1 로 바로 띄우는 바로가기를 만들어 두는 용도)
  if (/[?&]overlay=1/.test(location.search)) S.overlay = true;
  document.getElementById('overlayToggle').addEventListener('click', function () {
    S.overlay = !S.overlay;
    render();
    window.scrollTo(0, 0);
  });
  render();
})();
</script>
</body>
</html>
